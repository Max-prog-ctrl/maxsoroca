var P={"pictures": ["HOTEL_HILBERT", "FAG_BUTTS_IN_THE_FIRE_BUCKET", "BUBBLE_BOY", "INSANE_IN_THE_BRANE", "SULETHI", "KŘIŽERKI", "INSULARITY", "CHAPÜLÉE", "IVERIA [wip]", "RETIRER_D'EN_BAS_DE_L'EAU [wip]", "CHOPPER 2+1 [wip]", "ANITA [wip]", "THE_OBSERVER_EFFECT [wip]", "DJINNOLOGY [wip]", "AZDAJA [wip]"], "talks": ["FRIEDER_NAKE", "JANINA_LOH", "TORSTEN_ENSSLIN", "ZOE_HATZIYANNAKI", "ALBRECHT_BEUTELSPACHER", "WILLI_XYLANDER", "ROSA_MENKMAN"], "spaces": ["CAUCASUS", "BELARUS", "COCOONS", "CHIȘINĂU", "GORNO-BADAKHSHAN", "BEOGRAD", "GAGAUZIA", "TRANSNISTRIA", "SOROCA", "BAM", "HASANKEYF", "PERSIA", "KURDISTAN", "KUTAISI", "UKRAJINA", "OGYGIA", "ISSYK-KUL", "KYRGYZSTAN", "STANS", "YAZD", "RICHAT", "PATERNOSTER", "SELECTED_FRAMES"], "words": ["PLURIVERSUM", "DIE_ORDNUNG_DER_ZEIT", "KOSMISMUS", "DAS_UNIVERSUM_IN_DEINER_HAND", "DIE_ENTDECKUNG_DES_UNMÖGLICHEN", "UR_UND_ANDERE_ZEITEN", "UNSER_MATHEMATISCHES_UNIVERSUM", "DIE_KOSMISCHE_SCHLANGE", "DAS_KONNEKTOM", "GÖDEL,ESCHER,BACH", "WARUM_GOTT_DOCH_WÜRFELT", "WAS_IST_LEBEN?", "ES_GIBT_KEINE_MATERIE!", "IM_SPIEGEL_DER_SPRACHE", "DAS_GEHEIME_BEWUSSTSEIN_DER_PFLANZEN"], "sounds": ["IT_BEGAN_IN_EPPELSHEIM", "ES_IST_EIN_KRAUT_ENTSPRUNGEN", "DIE_LETZTE_WELT", "INSIDE/OUTSIDE", "WE_EXIST_IN_A_TWILIGHT_IN_BETWEEN", "STAN", "49_AUS_2020", "UPSET&RHYTHM"], "IST": "I . S . T\n\ninstitute of serendipity & transience\n\nstatus ........................... tba\nlocation ..................... 51.15°N 14.99°E\n\n° signal pending"},S={"CAUCASUS": {"s": "Кавказ • კავკასიონი • Կովկաս • Καύκασος • قفقاز • קווקז", "b": "Persian cosmographers placed a mountain at the rim of the world and called it Qaf. It was made of green emerald, and the colour of the sky was its reflection. Behind it, they said, there was nothing, and the nothing went on.\n\nSome readers moved Qaf to the Caucasus, because the names sound alike: Kūh-e Qāf, Ǧabal al-Qāf. Others left it where no map reaches. The Altai peoples tell of a similar wall, and nobody has settled which mountains are the last ones.\n\nThe photographs come from the valleys that sit closest to that edge: Khevsureti, the land of gorges, where people wore chain mail into the twentieth century; Tusheti with its stone towers, reachable by one road that closes for half the year; and the Pankisi Valley. In all three, the edge of the world is a few hours' walk uphill.\n\nOn the way, in no particular order: a church on a green knoll below Kazbek, seen once in 2006 and never quite in focus since; Dartlo; the empty towers of Chontio at the end of the valley; the pass up to Omalo, behind a flock of sheep; Shatili, through the window of a marshrutka; a guest room in Pankisi; a hammock in Udabno, on the way to David Gareja, close to the Azerbaijani border; the concrete seam that leads to Posof and on to Kars; a wall near Kutaisi that says what games my friends play.\n\nIn a roadside bar on the way to David Gareja, a Polish song from the sixties was playing, about a walk along a wild beach, a long way from any sea.\n\nSomebody in Pankisi told me of a man who had once been taken by a djinn and kept for a few days in a cave up in the mountains. I meant to find him and missed him. Perhaps he had only been drunk. Or the edge of the world is closer than a few hours.", "img": ["img/caucasus/w01", "img/caucasus/07", "img/caucasus/04", "img/caucasus/06", "img/caucasus/18", "img/caucasus/05", "img/caucasus/01", "img/caucasus/19", "img/caucasus/09", "img/caucasus/24", "img/caucasus/w10", "img/caucasus/10", "img/caucasus/17", "img/caucasus/08", "img/caucasus/20", "img/caucasus/21"], "th": "_t.jpg", "snd": {"img": "img/caucasus/17", "yt": "NYiMyoFtzRw", "t": 20, "d": 22}, "tags": {"img/caucasus/07": "Stepantsminda, Kazbek (Khevi)", "img/caucasus/04": "Dartlo (Tusheti)", "img/caucasus/06": "Chontio (Tusheti)", "img/caucasus/18": "Abano Pass, on the way to Omalo (Tusheti)", "img/caucasus/05": "marshrutka to Shatili (Khevsureti)", "img/caucasus/19": "Shatili (Khevsureti)", "img/caucasus/09": "Pankisi (Kakheti)", "img/caucasus/24": "Pankisi (Kakheti)", "img/caucasus/10": "Udabno (Kakheti)", "img/caucasus/17": "Udabno (Kakheti)", "img/caucasus/08": "Kartsakhi, Posof (Javakheti / Ardahan)", "img/caucasus/20": "Kutaisi (Imereti)", "img/caucasus/21": "near Kutaisi (Imereti)", "img/caucasus/w01": "Caucasus (Georgia)", "img/caucasus/01": "by the river (Tusheti)", "img/caucasus/w10": "Udabno, on the way to David Gareja (Kakheti)"}, "map": "CAUCASUS", "drift": "In Dartlo I sat for a day at a long table with men I had met the evening before. We had drunk then and drank again in the morning, and then we drove up towards Chontio, because a film crew was coming to make a classic film, they said. A supra, a tamada, toasts that lasted for minutes. All day they slaughtered. Their dogs had heads bigger than mine and were gentle as long as you were there. One of the men had lived in Germany for a while as an asylum seeker. At some point he said he had killed someone. We were drunk, and we pretended not to have understood. They called me Shurika, after Shurik, who came to the Caucasus to collect toasts.", "drift2": "In a village in Tusheti the shepherds kept one seat free at every supra for whoever had gone over the pass. Nobody sat there, but in the morning the glass was empty and the bread broken. One winter a boy filled the glass with water instead of wine, to see. In the morning the water was gone, and on the table lay a ticket for the marshrutka to Shatili, stamped, dated, not yet valid.", "inst": {"src": "img/caucasus/inst.jpg"}}, "BELARUS": {"s": "Беларусь", "b": "A country almost without height. Its highest point is three hundred and forty-five metres, a hill one climbs without noticing. What rises is forest, birch and pine and birch again, and between the trees fields too wide for the few people who work them. Once it was called the lung of the Soviet Union. In May the air is wet and does not move.\n\nApril 1986, the fourth reactor at Chernobyl, a few kilometres south of the border. The wind turned north. Most of what fell, fell here, on the region of Gomel, on villages that were emptied and handed back to the birches. Doors stand open there, and nobody shuts them. A school that had just been finished still stands in one of those villages, and the birches have moved into the classrooms.\n\nMinsk is wide and clean, with avenues built for parades. On the Island of Tears a chapel waits for the soldiers who came back from Afghanistan in zinc, or not at all. Outside the city, at Khatyn, a bronze man carries a boy who does not wake.\n\nNorth of Minsk, behind the ring road, lies Kurapaty. Pine, moss, hollows in the ground that look like nothing, like places where children play. Between 1937 and 1941 the NKVD brought people here and shot them, tens of thousands; nobody finished counting. Wooden crosses lean between the trees. Maya Kliashtornaya walked with us, an architect, born in May 1937, six months after they took her father, the poet Todar Kliashtorny. In October of that year he was shot. Her mother she saw again in 1947. At one of the hollows she stopped and spoke. Afterwards nobody could repeat what she had said, only where she had stood. There was talk of a motorway through the forest.\n\nSince 1994 the same man. Elections take place, and he wins them.\n\nThe photographs are from May 2005. Who held the camera is no longer quite clear.", "img": ["img/belarus/11", "img/belarus/01", "img/belarus/w09", "img/belarus/13", "img/belarus/15", "img/belarus/12", "img/belarus/24", "img/belarus/w05", "img/belarus/02", "img/belarus/22", "img/belarus/10", "img/belarus/w10", "img/belarus/16", "img/belarus/20", "img/belarus/05", "img/belarus/06", "img/belarus/08", "img/belarus/04", "img/belarus/09", "img/belarus/23"], "th": "_t.jpg", "geiger": {"hot": ["img/belarus/01"]}, "tags": {"img/belarus/01": "Strumen (Belarus)", "img/belarus/12": "near Strumen (Belarus)", "img/belarus/24": "near Strumen (Belarus)", "img/belarus/20": "Minsk (Belarus)", "img/belarus/05": "Minsk, Holy Spirit Cathedral (Belarus)", "img/belarus/06": "Minsk, Svislach (Belarus)", "img/belarus/08": "Island of Tears, Minsk (Belarus)", "img/belarus/04": "Khatyn (Belarus)", "img/belarus/09": "Kurapaty (Belarus)", "img/belarus/23": "Kurapaty, Maya Kliashtornaya (Belarus)", "img/belarus/11": "near Minsk (Belarus)", "img/belarus/w09": "Strumen (Belarus)", "img/belarus/w05": "at the barrier to Strumen (Belarus)", "img/belarus/13": "Volyntsy · Валынцы (Belarus)", "img/belarus/15": "Volyntsy · Валынцы (Belarus)", "img/belarus/02": "Volyntsy · Валынцы (Belarus)", "img/belarus/w10": "Volyntsy · Валынцы (Belarus)", "img/belarus/22": "Minsk (Belarus)", "img/belarus/10": "Minsk (Belarus)", "img/belarus/16": "Minsk (Belarus)"}, "map": "BELARUS", "drift": "Entering was forbidden. A teacher of physics in a small town nearby had a son, and the son was on duty at the barrier. He lifted it for a school bus full of strangers and came along, a counter in his hand, reading out numbers, some low, some not. Back at his hut, a few kilometres outside, where it should have been safer, the numbers rose. Five hundred becquerel, there. Every visit to a village began with four glasses of home-distilled spirit, poured to the brim, and a toast to love. At night there was a disco: a ring of people, arms linked, swaying in front of a ghetto blaster. The girls from Minsk who had come along to translate laughed with the guests, and at some point the faces in the ring changed. Somebody said the foreigners were taking their women. Then it was time to go to bed, quickly. Breakfast was fried in fat, with beer.", "inst": {"src": "img/belarus/inst.jpg", "pos": "left center"}, "drift2": "In the marshes a ferryman took anyone across for one coin, and nobody ever saw him take the coin. The river keeps count, people said. In the year the storks left early he refused a woman and told her she had already crossed. She stood on the bank a long time, then went home. Her neighbours swore she had not been out all day. When she came in, the little needle on the wall clicked twice."}, "COCOONS": {"s": "ΦΆΚΕΛΟΙ ΤΗΣ ΖΩΉΣ", "b": "Life begins where something is wrapped. A membrane around a cell, an atmosphere around a planet: an inside appears, and only an inside can be lived in.\n\nThe later shells are built by states, and they are built to be seen from outside. From a window of the Palace of the Parliament in Bucharest the boulevard below runs straight towards the haze, as if the city had been drawn with a ruler. In Tbilisi the Ministry of Highway Construction, finished in 1975, stacks its offices crosswise like bridges over a road that is not there; since 2007 a bank has lived in it. In Dushanbe new palaces with turrets rise behind an old Soviet star. In Kryvyi Rih the city follows a seam of iron ore for more than a hundred kilometres, so that it is long rather than large.\n\nKaji-Say on the southern shore of Issyk-Kul was founded in 1947 for brown coal. Uranium was then taken out of the ash of that coal, and prisoners were sent to dig. Today you look through an empty window frame at the blocks that remained, with red mountains behind them.\n\nThe hill from which one sees Marzahn was made, too. Between 1981 and 1991 the Ahrensfelder Berge served as a dump for building rubble, so that one of the largest new estates in Europe is now looked at from a heap of its own leftovers.\n\nFrom outside every shell looks like the next one. Behind each window someone has hung their own curtain, collected porcelain, let pipe smoke settle in the wallpaper until the room smells of one person only. In the evening the lights go on one after another, and for a moment the façade shows who is home.", "img": ["img/huellen/01", "img/huellen/w02", "img/huellen/04", "img/huellen/06", "img/huellen/08", "img/huellen/16", "img/huellen/15", "img/huellen/22", "img/huellen/14", "img/huellen/18", "img/huellen/03", "img/huellen/21", "img/huellen/w01", "img/huellen/13", "img/huellen/19", "img NOW; Romanian: [kiʃiˈnəw]", "b": "Adam Smith wrote the words invisible hand three times in his life, no more. The first time, in a young man's essay on the history of astronomy, the hand belonged to Jupiter. The ancients needed it for whatever refused to behave: thunder, a comet, a storm in the wrong season. Later Smith lent the same hand to the market, twice, almost in passing. The economists kept it and forgot where it came from. That is how a god becomes a mechanism. Since then the market has moods, nervous in the morning, panicking by noon, in need of calming, and nobody asks who does the calming.\n\nThe first exchange was not a building. It was a doorstep in Bruges, outside the inn of a family called van der Beurse, where merchants stood in the cold and told each other what things would cost tomorrow. Above the door hung the family's coat of arms, three purses, and the purse, if you follow the word back far enough, is a Greek word for the skin pulled off an animal. Leather, a purse, a family, a square: their name is still on every house where prices are made of rumour.\n\nIn Chișinău the hand has fingers. They lay bacon on a blue scale like a sleeping animal, build towers of toilet paper and give each tower a number, stand sparkling wine next to Coca-Cola so that both look a little lost. Among clocks that no longer agree on the hour lie helmets nobody wears.\n\nOne hand sold newspapers. John Onoje, born in Sierra Leone in 1959, waited more than ten years as a refugee before Moldova let him become Moldovan, in January 2011. That same year parliament could not find a president, so he offered himself. A former head of state talked in public about the colour of his skin. Men beat him, once in a toilet beneath the street, and he went on selling newspapers. In February 2024 he died.\n\nPerhaps that is what the hand does best. It moves things and leaves no fingerprints; you notice it only afterwards, in the price.", "img": ["img/chisinau/01", "img/chisinau/w22", "img/chisinau/02", "img/chisinau/w24", "img/chisinau/03", "img/chisinau/w23", "img/chisinau/04", "img/chisinau/w25", "img/chisinau/w21", "img/chisinau/05", "img/chisinau/w19", "img/chisinau/06", "img/chisinau/w20", "img/chisinau/07", "img/chisinau/w16", "img/chisinau/08", "img/chisinau/09", "img/chisinau/10", "img/chisinau/11", "img/chisinau/12", "img/chisinau/13", "img/chisinau/14", "img/chisinau/15", "img/chisinau/16"], "th": "_t.jpg", "drift": "A cobbler on the market street mended shoes for people he never saw. In the morning there was a pair on his step, in the evening he put them back, repaired, and the next morning the money lay there, always exact. When he died his daughter waited up one night. Nobody came. Only the lamp outside flickered in four short beats and went steady, as if something had been confirmed.", "dmode": "h"}, "GORNO-BADAKHSHAN": {"s": "Вилояти Мухтори Кӯҳистони Бадахшон", "b": "Things that cross the Panj: the bark of a dog from Afghanistan. Relatives, on Saturday mornings, to a market on an island in no man's land, back when there was one. A language, spoken on both banks in two towns called Ishkashim.\n\nThings that do not: the names of the peaks. Karl Marx and Engels still stand above the road.\n\nOver the Bartang at Jizev, a cabin on a cable, pulled by hand. The man who took us went first without it, to bring it back for us.\n\nOn the rock above Langar, more than six thousand ibex, deer, hunters and horsemen, each hand adding to the last, from the Stone Age to the Middle Ages. From the same slope, a few stones, thrown by a boy.\n\nWithin five minutes one morning, a greeting: Geil Gitler, with a G for each H, the way Russian has it, first from our driver, then from his cousin, who had the same name and said it differently. Some Pamiri, we were told, had suffered so much under Stalin that they believed the other one would have spared them, Aryans as they were said to be.\n\nIn a single night in 1911, a mountainside, which fell and became the dam of Lake Sarez. Seventeen cubic kilometres of water have stood behind it since.\n\nThrough the window of a Soviet Kurort near Khorugh, the wind, held back by a sheet of plastic. Kurort is a word that crossed from German into Russian. The pool was empty.\n\nIn Bulunkul, in the weather station, tea. Today it is warm, said the man. Minus ten.", "img": ["img/gornobadakhshan/01", "img/gornobadakhshan/w02", "img/gornobadakhshan/02", "img/gornobadakhshan/03", "img/gornobadakhshan/04", "img/gornobadakhshan/w13", "img/gornobadakhshan/05", "img/gornobadakhshan/w22", "img/gornobadakhshan/06", "img/gornobadakhshan/07", "img/gornobadakhshan/w12", "img/gornobadakhshan/08", "img/gornobadakhshan/w16", "img/gornobadakhshan/09", "img/gornobadakhshan/w03", "img/gornobadakhshan/10", "img/gornobadakhshan/11", "img/gornobadakhshan/w07", "img/gornobadakhshan/12", "img/gornobadakhshan/w04", "img/gornobadakhshan/13", "img/gornobadakhshan/w18", "img/gornobadakhshan/w11", "img/gornobadakhshan/14", "img/gornobadakhshan/w14", "img/gornobadakhshan/15", "img/gornobadakhshan/16", "img/gornobadakhshan/w24", "img/gornobadakhshan/17", "img/gornobadakhshan/18", "img/gornobadakhshan/19", "img/gornobadakhshan/20"], "th": "_t.jpg", "tags": {"img/gornobadakhshan/05": "Bartang · Бартанг (Pamir)", "img/gornobadakhshan/06": "Jizev · Джизев (Bartang)", "img/gornobadakhshan/07": "Jizev · Джизев (Bartang)", "img/gornobadakhshan/08": "across the Panj (Afghan Badakhshan)", "img/gornobadakhshan/09": "Langar · Лангар (Wakhan)", "img/gornobadakhshan/13": "Bulunkul · Булункуль (Murghab)", "img/gornobadakhshan/14": "Bulunkul · Булункуль (Murghab)", "img/gornobadakhshan/16": "Khorugh · Хорог (Shughnan)", "img/gornobadakhshan/17": "Khorugh · Хорог (Shughnan)", "img/gornobadakhshan/18": "Khorugh · Хорог (Shughnan)", "img/gornobadakhshan/w16": "across the Panj (Afghan Badakhshan)", "img/gornobadakhshan/w18": "Bulunkul · Булункуль (Murghab)", "img/gornobadakhshan/w22": "Jizev · Джизев (Bartang)"}, "map": "TAJIKISTAN", "inst": {"src": "img/gornobadakhshan/inst.jpg"}, "drift": "On the Afghan side a woman sang every evening across the river, and on this side someone sang back. Nobody knew who. The soldiers on the bank listened and did not report it. One summer a boy recorded it on a cheap telephone. When they played it back, there were three voices."}, "BEOGRAD": {"s": "Београд•ALBA GRECA", "b": "White city, the name says. In the Middle Ages the Latin documents called it Alba Graeca, the Greek white one; before that it was Singidunum, a Celtic name that the Romans kept.\n\nIt stands where the Sava flows into the Danube, and whoever wanted to go from one empire into the next had to pass here. It is said that the city has been fought over more than a hundred times and razed to the ground more than forty. Each time it was built again in the same place, as if the place were the point and the city only its current form.\n\nIn 1999 bombs hit the general staff building on Kneza Miloša. For years it stood open in the middle of the city, its floors visible like the pages of a cut book.", "img": ["img/beograd/02", "img/beograd/07", "img/beograd/19", "img/beograd/10", "img/beograd/05", "img/beograd/13", "img/beograd/21", "img/beograd/18", "img/beograd/12", "img/beograd/23", "img/beograd/22", "img/beograd/24"], "th": "_t.jpg", "drift": "A man fished from the bridge where the two rivers meet, every morning, and never caught anything. He said he was fishing in the third river, the one under the other two. One spring he stayed at home for a long time. When he came back, the first thing he pulled out was a hotel key with a room number on it, from a hotel that had not been built yet.", "dmode": "circle"}, "GAGAUZIA": {"s": "Avtonom Territoriali Bölümlüü Gagauziya", "b": "In the south of Moldova lives a people that speaks a Turkic language and prays in Orthodox churches. Where the Gagauz came from is disputed. Some say from the Seljuks, some from the Cumans, some from the steppe in general; what is certain is that in the early nineteenth century they settled in the Budjak, in villages left empty by others.\n\nIn 1994 Moldova gave them an autonomy of their own, with a governor, a parliament and the right to leave if Moldova ever became part of Romania. So far nobody has had to use that clause. It is there like a spare key in a drawer.", "img": ["img/gagauzia/11", "img/gagauzia/23", "img/gagauzia/16", "img/gagauzia/03", "img/gagauzia/05", "img/gagauzia/06", "img/gagauzia/09", "img/gagauzia/18", "img/gagauzia/13", "img/gagauzia/08", "img/gagauzia/19", "img/gagauzia/24", "img/gagauzia/15", "img/gagauzia/20", "img/gagauzia/07", "img/gagauzia/22"], "th": "_t.jpg", "drift": "In Comrat I stayed with an older woman, an independent journalist, who put up travellers on her sofa. A rapper showed me his recording studio. He told me, with some pride, that he had already played in Turkey. The studio was inside the parliament building. When we stepped out into the corridor for a moment, a session was under way, and for a while we stood in the parliament of an autonomy that keeps its spare key in the drawer.", "drift2": "An old woman in the steppe was said to talk to the wind in a language nobody understood, not Turkish, not Romanian, not Russian. On her last night the priest wrote down what she said, sound by sound, as well as he could. The page lay in the church for a hundred years. Then someone read it aloud at a wedding, and every radio in the street went quiet and came back on another station.", "inst": {"src": "img/gagauzia/inst.jpg"}}, "TRANSNISTRIA": {"s": "Pridnestrovian Moldovan Republic", "b": "Through a hole someone scraped into the tinted window of a bus: a country the size of a coin. Some of its coins are made of plastic.\n\nTwo bank cards stopped working in Chișinău within a minute of each other, each refusing the other's number. A country that nobody recognises was entered on what was left in the pockets. It seemed fair.\n\nAt the border the money changes its name. Behind it, Lenin still stands outside the parliament, and a company called Sheriff sells the bread, the petrol, the evening news and the football. It was Easter. The streets had been emptied, for the resurrection or for something else.\n\nA man who rents out beds wrote that he would beat up his guest. Then he wrote it again under another name, as if a second person agreed.\n\nThe hotel on the Dniester was large, Soviet and bad. Next door, beside an empty Ferris wheel, a sports journalist poured cognac and asked whether a German magazine might need someone who knows Tiraspol.\n\nThrough the hole in the window, once more, the country the size of a coin.", "img": ["img/transnistria/01", "img/transnistria/02", "img/transnistria/03", "img/transnistria/04", "img/transnistria/05", "img/transnistria/06", "img/transnistria/07", "img/transnistria/08", "img/transnistria/09", "img/transnistria/10", "img/transnistria/11", "img/transnistria/12", "img/transnistria/13", "img/transnistria/14", "img/transnistria/15", "img/transnistria/16", "img/transnistria/17", "img/transnistria/18", "img/transnistria/19", "img/transnistria/20", "img/transnistria/21", "img/transnistria/22", "img/transnistria/23", "img/transnistria/24", "img/transnistria/25", "img/transnistria/26", "img/transnistria/27", "img/transnistria/28", "img/transnistria/29", "img/transnistria/30", "img/transnistria/31", "img/transnistria/32"], "th": "_t.jpg", "drift": "At the checkpoint the guard stamps every passport twice, once for the country and once for the one that is not on any map. In the second stamp the date is always the same. A woman who has crossed every week for thirty years once looked closely. It was a date in the future, and every year it comes a little closer.", "dmode": "v"}, "SOROCA": {"s": "Сороки (Бессарабія)", "b": "Soroca (Romanian), in Russian and Ukrainian Сороки (Soroki, \"magpie\"). The Moldovan town lies in historical Bessarabia, on the Dniester.\n\nIn the 12th and 13th centuries Genoese merchants crossed the river here. Within the principality of Moldavia (around 1350 to 1538) the fortress was of great military importance for the protection of the eastern border against the Tatars. Near the village of Lipnic, in the north, the Moldavian army of Stefan cel Mare defeated the Tatars of the Golden Horde under Ahmed Khan on 20 August 1470. Many of them drowned in the Dniester as they fled. Soroca was first mentioned in a document in 1499.\n\nThe name Bessarabia goes back to the Basarab, a Wallachian dynasty of princes who ruled the region in the 13th and 14th centuries, and has nothing to do with Arabia. Originally it meant only the southern third of the country, Terra Bassarabum in Latin. After Russia took over in 1812, the name was given to the whole area between the Prut and the Dniester.\n\nToday Soroca has some 22,000 inhabitants. Many of them are Roma, which makes it their unofficial capital in Moldova. On a hill above the town, called Gypsy Hill, families built houses after the Bolshoi Theatre in Moscow and the Capitol in Washington. Some are finished, some half, some are falling apart; many of the owners have died or gone abroad. One of them, a man who called himself king of the Roma, is said to have built his Capitol from the picture on a dollar note. It was the only picture he had.\n\nThe magpie (Pica pica) is a bird of the crow family. It lives in many parts of Europe and Asia and in North Africa; in Europe it likes to stay close to people. Because of its black and white feathers and long tail, anyone can recognise it.\n\nIn Germanic mythology the magpie was both a messenger of the gods and the bird of Hel, goddess of death, and so it became a bringer of mischief. As the thieving magpie it was unpopular in the Middle Ages too, as the witches' companion and the bird of the gallows. In Asia, by contrast, it is traditionally a talisman.\n\nThe Cheyenne and the Lakota tell of a time when the buffalo ate the humans. A race was to decide who would eat whom. The humans did not run themselves; four birds flew for them, and one of them was the American magpie (Pica hudsonia). The buffalo runner led the whole way. Just before the finish the magpie dropped from the sky and passed her. Since then the humans hunt the buffalo, and they never eat the magpie.", "img": ["img/soroca/01", "img/soroca/02", "img/soroca/03", "img/soroca/04", "img/soroca/05", "img/soroca/06", "img/soroca/07", "img/soroca/08", "img/soroca/09", "img/soroca/10", "img/soroca/11", "img/soroca/12", "img/soroca/13", "img/soroca/14", "img/soroca/15", "img/soroca/16", "img/soroca/17", "img/soroca/18", "img/soroca/19", "img/soroca/20", "img/soroca/21", "img/soroca/22", "img/soroca/23", "img/soroca/24"], "th": "_t.jpg", "drift": "The fortress on the Dniester was built, they say, in a single night, and every year one stone goes missing. Nobody takes it. Children have kept watch; at dawn there is a gap where there was none. A boy once counted the stones that were left and worked out the year the fortress would be gone. He wrote it on the wall in chalk. In the morning the number had been corrected.", "dmode": "circle"}, "BAM": {"s": "ارگ بم", "b": "Lieutenant Drogo's first posting is the Bastiani fortress at the edge of the empire, facing the emptiness of the Tartar desert. No enemy is to be seen, yet the garrison keeps its duties to the letter: the watches, the passwords, the changing of the guard. Years go by in the waiting.\n\nA soldier who comes back from outside the walls without the password is shot by the sentry, because the rules say so. An officer dies of cold in the mountains on a mission to mark the border. Drogo stays. When the Tartars finally appear on the horizon, he is old and ill, and he is sent down in a carriage to make room. He dies alone in a room at an inn.\n\nValerio Zurlini filmed the novel in 1976 in Bam, in the mud-brick citadel that had stood in the Iranian desert for some two thousand years and had waited, like the fortress in the book, for something to come.\n\nOn 26 December 2003 it came, from below. An earthquake destroyed the citadel and most of the city within seconds. Tens of thousands died. The citadel is being rebuilt from the same earth, brick by brick.", "img": ["img/bam/01", "img/bam/03", "img/bam/04", "img/bam/05", "img/bam/06", "img/bam/07", "img/bam/08", "img/bam/09", "img/bam/10", "img/bam/11", "img/bam/w11", "img/bam/12", "img/bam/13", "img/bam/14", "img/bam/15", "img/bam/16", "img/bam/17", "img/bam/18", "img/bam/19", "img/bam/20"], "th": "_t.jpg", "drift": "At the gate of the citadel a guard asked every traveller for the password, and nobody ever knew it. He let them in anyway. When the city fell he was found at his post, standing, his mouth open, as if he had just been told. The people who now listen to the mud walls with their instruments say that on some nights the walls repeat a word. It has four syllables, and it is never the same.", "dmode": "hv"}, "HASANKEYF": {"s": "Κιφας, Heskîf, Hesenkêf, Hesna/Hesno, Hsenkep, Hesno d-kepo, ܚܨܢ ܟܐܦܐ", "b": "Hasankeyf lay on the banks of the Tigris in southeastern Turkey. Its history goes back to the Neolithic. Romans, Byzantines, Artuqids, Ayyubids and Ottomans left fortresses, mosques, a bridge and cave dwellings carved into the steep cliffs along the river.\n\nThen the Ilısu Dam was built downstream. There were protests, in Turkey and abroad, by historians and activists. The dam was completed anyway. Some monuments were cut out of the old town and carried on wheels to a park on the other bank; a tomb travelled two kilometres in one piece. By 2020 most of Hasankeyf lay under the water of the Tigris.\n\nThe pictures show Hasankeyf before the flooding, and New Hasankeyf on a hill to the east, still under construction at the time. It took years until the flats were ready, because the flooding was postponed again and again. Some of the families were glad to move up.", "img": ["img/hasankeyf/01", "img/hasankeyf/w18", "img/hasankeyf/w21", "img/hasankeyf/05", "img/hasankeyf/o_beer", "img/hasankeyf/06", "img/hasankeyf/07", "img/hasankeyf/09", "img/hasankeyf/w01", "img/hasankeyf/w22", "img/hasankeyf/w02", "img/hasankeyf/w12", "img/hasankeyf/w11", "img/hasankeyf/11", "img/hasankeyf/w03", "img/hasankeyf/o_shower"], "th": "_t.jpg", "drift": "In the time of the river kings a potter lived in the third cave above the bend. Every evening he set a bowl of water at the entrance for whoever walked home late along the cliff. Some mornings the bowl was empty, some mornings it was full of sand. One winter a stranger came down from the north and asked to sleep in the cave. He paid in salt and said he was waiting for the bus. The potter gave him the bowl. In the morning the stranger was gone, the water stood still, and on its surface lay the whole valley, lit from below.", "drift2": "A woman sold salt by the bridge and told everyone the same thing: one day men will come and stop the river with a wall, and the river will climb the steps to the citadel and sit down in the temple. People laughed and bought her salt. When she died they found in her basket a small flat stone, black and smooth on every side, that sometimes lit up by itself.", "dmode": "cross"}, "PERSIA": {"s": "چهره‌های ایران", "b": "A country of many peoples, more than any list manages to hold: Persians, Azeris, Kurds, Lurs, Baluch, Arabs, Turkmen, Gilaks, Mazandaranis, Talysh, Armenians, Assyrians, Georgians, Jews, Mandaeans, Zoroastrians, Afro-Iranians on the Gulf coast, nomads like the Qashqai and the Bakhtiari, and others whose names only their neighbours know.\n\nThe photographs were taken around 2013 on the road between Tabriz and Bam, most of them by the photographer Lena Johnson.", "img": ["img/persia/01", "img/persia/02", "img/persia/03", "img/persia/04", "img/persia/05", "img/persia/06", "img/persia/07", "img/persia/08", "img/persia/09", "img/persia/10", "img/persia/11", "img/persia/12", "img/persia/13", "img/persia/14", "img/persia/15", "img/persia/16", "img/persia/17", "img/persia/18", "img/persia/19", "img/persia/20", "img/persia/21", "img/persia/22", "img/persia/23", "img/persia/24"], "th": "_t.jpg", "drift": "A scribe copied the same book all his life, because each copy came out slightly different from the last. In his final copy the margins were full of words in a script nobody could read. Decades later a grandson photographed the page. On the screen, for a moment, the script was in Latin letters, and then it was not.", "dmode": "h"}, "KURDISTAN": {"s": "(kurdish کوردستان Kūrdistān; arabic كردستان, DMG Kurdistān; persian کردستان Kordestān; turkish Kürdistan)", "b": "A nation of more than thirty million people and, for most of a century, almost no state. The few that existed were brief.\n\nFrom 1923 to 1929 there was a Red Kurdistan in the Soviet Union, between Karabakh and Armenia, with Lachin as its centre and Kurmanji as its official language. In 1927, during an uprising on the slopes of Mount Ararat, a Republic of Ararat was proclaimed; by 1930 it had been crushed. In 1946, in the Iranian town of Mahabad, a Kurdish republic held out for eleven months.\n\nEach of them was a state for the length of a breath. Today the autonomous region in northern Iraq, with its capital in Erbil, is the longest such breath so far.", "img": ["img/kurdistan/01", "img/kurdistan/02", "img/kurdistan/03", "img/kurdistan/04", "img/kurdistan/05", "img/kurdistan/06", "img/kurdistan/07", "img/kurdistan/08", "img/kurdistan/09", "img/kurdistan/10", "img/kurdistan/11", "img/kurdistan/12", "img/kurdistan/13", "img/kurdistan/14", "img/kurdistan/15", "img/kurdistan/16", "img/kurdistan/17", "img/kurdistan/18", "img/kurdistan/19", "img/kurdistan/20", "img/kurdistan/21", "img/kurdistan/22", "img/kurdistan/23", "img/kurdistan/24"], "th": "_t.jpg", "drift": "The border takes the whole afternoon. Men in uniform run from one hut to the next with our passports, come back, run again. Then a stamp. On the other side nobody lets us pay. Not for the taxi, not for the tea, not for the room. We try at every counter; someone has always been faster. After three days we still have every dinar we changed at the border.", "drift2": "Above a town built on a rock a man guarded a gate that had no wall left on either side. Travellers could have walked around it. They never did. They waited, gave their names, and he wrote them into a book that had more pages than it should. When he died his son opened the book and found, on the last written page, in his father's hand, our two names.", "inst": {"src": "img/kurdistan/inst.jpg"}}, "KUTAISI": {"s": "ქუთაისი (ეგრისი)", "b": "I arrived in Kutaisi by chance and took a room in a guesthouse run by a Russian who looked like a Cyclops, and by his friendly partner. In the shop next door a man of about fifty was snorting and swaying. I did not understand the language, but I understood that it was about me, and that he had placed me in the United States, which he detested.\n\nWe agreed, with hands and broken words, that I was perhaps not capitalism itself, and he invited me home for wine. He lived a few houses away with his mother. According to him and his much younger neighbour, who joined us later, the Thieves in Law had been founded right there, and until recently murder had been ordinary. His mother got angry when he played Roger Waters and Deep Purple too loud on YouTube. The neighbour told me later that he had once driven for the US military and had lost his licence after zigzagging away from the police. The neighbour himself had failed his final exam: at the door of the lecture hall his girlfriend told him that it was over and that she had never loved him. He had to repeat the year.\n\nBack at the guesthouse, the Cyclops wanted to show me the garden. It was dark, and his forehead was large, and I said: tomorrow. His partner smiled at me like someone who knows things one cannot imagine: no, now, go. So we went, through the cicadas and under low trees, until we reached the river, bright under the full moon. He lit a cigarette and told me that the Argo had passed here three thousand years ago, looking for the Golden Fleece.\n\nFor a moment I was not in the present. Colchis, the Argonauts searching for what does not die, next to me a Cyclops whose ancestors might have come from Pelion. I was only his excuse, an accomplice: he was not allowed to smoke in front of her. I had just stopped smoking myself. It was the best cigarette I never smoked.", "img": ["img/kutaisi/01", "img/kutaisi/02", "img/kutaisi/03", "img/kutaisi/04", "img/kutaisi/05", "img/kutaisi/06", "img/kutaisi/07", "img/kutaisi/08", "img/kutaisi/09", "img/kutaisi/10", "img/kutaisi/11", "img/kutaisi/12", "img/kutaisi/13", "img/kutaisi/14", "img/kutaisi/15", "img/kutaisi/16", "img/kutaisi/17", "img/kutaisi/18", "img/kutaisi/19", "img/kutaisi/20", "img/kutaisi/21", "img/kutaisi/22", "img/kutaisi/23", "img/kutaisi/24"], "th": "_t.jpg", "drift": "In a guesthouse by the river the owner laid the breakfast table for one more than had slept there. Every morning the extra cup had been used. The guests made jokes about it, then stopped. One left before dawn and saw the table already laid, the cup steaming, the chair pushed back as if someone had just stood up to take a call.", "dmode": "v"}, "UKRAJINA": {"s": "УКРАЇНА - НЕЗАЛЕЖНА З 24 СЕРПНЯ 1991 РОКУ", "b": "For a few years, in the middle of a civil war, part of this country tried to live without masters. From 1918 to 1921 the Makhnovshchina, an army of peasants and partisans around Nestor Makhno from Huliaipole, held a territory in the south-east and organised it in free communes. Red and White fought it, and in the end the Red won.\n\nThe country is the largest that lies entirely in Europe, and it has been fought over for that reason as long as there have been maps. The name of its neighbour comes from Kyivan Rus, from the city that is its own capital, which some people on the other side find hard to forgive.\n\nThe photographs were taken in villages and in Lviv, Chernivtsi, Dnipro, Kryvyi Rih, Odesa and Kyiv.", "img": ["img/ukrajina/01", "img/ukrajina/02", "img/ukrajina/03", "img/ukrajina/04", "img/ukrajina/05", "img/ukrajina/06", "img/ukrajina/07", "img/ukrajina/08", "img/ukrajina/09", "img/ukrajina/10", "img/ukrajina/11", "img/ukrajina/12", "img/ukrajina/13", "img/ukrajina/14", "img/ukrajina/15", "img/ukrajina/16", "img/ukrajina/17", "img/ukrajina/18", "img/ukrajina/19", "img/ukrajina/20", "img/ukrajina/21", "img/ukrajina/22", "img/ukrajina/23", "img/ukrajina/24"], "th": "_t.jpg", "drift": "In the steppe there was a well that answered. You called your name into it, and after a while it called back, a little older. In the years without a state people came from far away to hear how their voices would sound. Some heard nothing. One heard a voice reading out numbers, calmly, as if from a list.", "dmode": "circle"}, "OGYGIA": {"s": "Ὠγυγίη - Ομφαλός της θάλασσας", "b": "...found them inside. They lit a big fire on the barbecue, which spread all over the island, burning cedar, hemlock and thuja.\n\nThere she is: singing with her beautiful voice and weaving with the golden shuttle on the loom. Around the cave was a dense forest of poplars, alders and fragrant cypresses. Birds were sitting on the branches with their wings spread out: Hawks, owls and long-tailed terns that spent the day at sea.\n\nAnd up ahead, a rich and fertile vineyard, laden with grapes, surrounded the deep cave. Four fountains in a row, one on each side, and yet each of them pours its gurgling water somewhere else. On either side, soft meadows with wild violets and wild celery...", "img": ["img/ogygia/01", "img/ogygia/02", "img/ogygia/03", "img/ogygia/04", "img/ogygia/05", "img/ogygia/06", "img/ogygia/07", "img/ogygia/08", "img/ogygia/09", "img/ogygia/10", "img/ogygia/11", "img/ogygia/12", "img/ogygia/13", "img/ogygia/14", "img/ogygia/15"], "th": "_t.jpg"}, "ISSYK-KUL": {"s": "Ysyk-Köl, Kyrgyz: Ысык-Көл, romanized: Ysyk-Köl, lit. 'warm lake', [ɯsɯk kœl]", "b": "The warm lake, its name means, and it does not freeze, although it lies at sixteen hundred metres between mountains that are white all year. It is more than six hundred metres deep and slightly salty, and it is one of the oldest lakes on earth. In Soviet times torpedoes were tested in it, far from any sea.\n\nOn its eastern shore stands Karakol, founded in 1869 as a Russian outpost. When the explorer Przhevalsky died there, the town was given his name; it was given back its old name, then his again, then its old one. A town that cannot decide whom it belongs to.\n\nOn the southern shore lies Kadji-Say. Coal was mined there, then uranium, and when the uranium ran out sooner than planned, most of the fifteen thousand people left. Blocks of flats, a kindergarten, administrative buildings stand empty. Above the town lie the tailings, fenced in badly. Every spring the meltwater comes down from the mountains, and every spring the question is whether it will carry them into the lake.", "img": ["img/issykkul/01", "img/issykkul/02", "img/issykkul/03", "img/issykkul/04", "img/issykkul/05", "img/issykkul/06", "img/issykkul/07", "img/issykkul/08", "img/issykkul/09", "img/issykkul/10", "img/issykkul/11", "img/issykkul/12", "img/issykkul/13", "img/issykkul/14", "img/issykkul/15", "img/issykkul/16", "img/issykkul/17", "img/issykkul/18", "img/issykkul/19", "img/issykkul/20", "img/issykkul/21", "img/issykkul/22", "img/issykkul/23", "img/issykkul/24"], "th": "_t.jpg", "drift": "Under the lake, the fishermen say, lies a town that went down with its lamps still lit. On calm nights you can see them. A diver went down once to count them and came up with a number written on his wrist. He did not remember writing it. It has eleven digits, and when you dial it, it rings somewhere very far away, and nobody picks up.", "dmode": "circle"}, "KYRGYZSTAN": {"s": "Кыргыз Республикасы", "b": "Kyrk means forty. One story says the Kyrgyz descend from forty tribes; another from forty girls who came back from a journey to find their people gone and became warriors themselves. The epic Manas, which is longer than the Iliad and the Odyssey together and was carried for centuries by memory alone, holds both.\n\nChinese chroniclers recorded their name more than two thousand years ago. In the ninth century the Yenisei Kyrgyz ruled an empire that reached from Lake Baikal to the Tian Shan; later they were ruled by Mongols, Oirats, Qing and Russians.\n\nThe republic has existed since 31 August 1991. Three times since then its people have driven out a president. In 2010, in the south, around Osh, hundreds of people were killed in a few days, most of them Uzbeks. The country is small, and nine tenths of it are mountains.", "img": ["img/kyrgyzstan/01", "img/kyrgyzstan/02", "img/kyrgyzstan/03", "img/kyrgyzstan/04", "img/kyrgyzstan/05", "img/kyrgyzstan/06", "img/kyrgyzstan/07", "img/kyrgyzstan/08", "img/kyrgyzstan/09", "img/kyrgyzstan/10", "img/kyrgyzstan/11", "img/kyrgyzstan/12", "img/kyrgyzstan/13", "img/kyrgyzstan/14", "img/kyrgyzstan/15", "img/kyrgyzstan/16", "img/kyrgyzstan/17", "img/kyrgyzstan/18", "img/kyrgyzstan/19", "img/kyrgyzstan/20", "img/kyrgyzstan/21", "img/kyrgyzstan/22", "img/kyrgyzstan/23", "img/kyrgyzstan/24"], "th": "_t.jpg", "drift": "The storyteller in the yurt knew the epic by heart, half a million lines. He said one line was missing, and that he had heard it only once, as a boy, from a stranger at a horse market. Every winter he sang the whole of it and paused where the line belonged. In the last winter of his life someone in the yurt, nobody saw who, filled the pause.", "dmode": "h"}, "STANS": {"s": "UZBEKISTAN•TAJIKISTAN•KAZAKHSTAN", "b": "Three republics that ended up independent in the same autumn without having asked for it: Uzbekistan on 31 August 1991, Tajikistan on 9 September, Kazakhstan last of all the Soviet republics, on 16 December, when there was hardly a union left to leave.\n\nThe suffix means land, place, where one stands. Kazakhstan is the largest country without a coast. Tajikistan fought a civil war through the nineties. In Uzbekistan the cotton fields that drained the Aral Sea are still there; the sea is mostly not.", "img": ["img/stans/01", "img/stans/02", "img/stans/03", "img/stans/04", "img/stans/05", "img/stans/06", "img/stans/07", "img/stans/08", "img/stans/09", "img/stans/10", "img/stans/11", "img/stans/12", "img/stans/13", "img/stans/14", "img/stans/15", "img/stans/16", "img/stans/17", "img/stans/18", "img/stans/19", "img/stans/20", "img/stans/21", "img/stans/22", "img/stans/23", "img/stans/24"], "th": "_t.jpg", "drift": "In a border town the station clock showed three different times, one for each republic, and nobody ever set it. The trains ran on a fourth. An old railwayman said the fourth was the time the tracks remembered. When the station was renovated, the new clock showed only one time, and every night at four minutes past three it stopped and waited.", "dmode": "v"}, "YAZD": {"t": "MAZDAYASNA", "s": "ZOROASTRISM • BEHDIN", "b": "In Yazd a fire has been burning in a temple for about fifteen hundred years, it is said. It was carried from place to place when the believers had to flee, and it has never gone out.\n\nZoroastrianism is among the oldest of the living religions. Its god is Ahura Mazda, the wise lord, and his adversary is Angra Mainyu. One branch, long extinct, placed something above both: Zurvan, time, and in particular Zurvan Akarana, time without limit, from which light and darkness were born as twins. In the material world, the Zurvanites believed, that infinite time appears only in a finite form, as the time that passes.\n\nOutside the city stand two hills with round walls on top, the Towers of Silence. Until a few decades ago the dead were laid out there, so that neither earth nor fire would be defiled, and the vultures took what was left of them. Today the towers are empty, and the wind goes through.", "img": ["img/yazd/01", "img/yazd/02", "img/yazd/03", "img/yazd/04", "img/yazd/05", "img/yazd/06", "img/yazd/07", "img/yazd/08", "img/yazd/09", "img/yazd/10", "img/yazd/11", "img/yazd/12", "img/yazd/13", "img/yazd/14"], "th": "_t.jpg", "drift": "The keeper of the fire was not allowed to breathe on it, so he wore a cloth over his mouth, as his father had and his father's father. When the last of them died, they found under the cloth a small mark on his lip, like a burn, in the shape of a letter from no alphabet the family had ever used. The fire did not flicker that night.", "dmode": "circle"}, "RICHAT": {"s": "عين الصحراء • MAURITANIA • 2025", "b": "The country is mostly sky. Underneath it, a road leaves the sea at Nouadhibou, passes a hut with a flag, runs into stone and then into sand.\n\nSomewhere in the middle the ground forms rings, some forty kilometres across. It is called the Eye of the Sahara, or the Eye of Africa. Standing inside it, there is nothing to see but gravel; the eye only works from far away.\n\nTerjit is a gorge with palms and warm water. Atar is a market town. In Ouadane the old town lies in ruins above the new one. There we met Saida. On the drive back she asked for German music, so the car played the Düsseldorf Düsterboys across the dunes; before that, it had been guitars from Agadez.\n\nChinguetti is the seventh holy city of Islam, people say, or the eighth, or the ninth; the number changes with whoever tells it. In its libraries manuscripts lie under glass, and the pages are turned with white gloves. Ouadane, Chinguetti, Tichitt and Oualata have been on UNESCO's list since 1996. The sand has not read it.", "img": ["img/richat/01", "img/richat/02", "img/richat/03", "img/richat/04", "img/richat/05", "img/richat/06", "img/richat/07", "img/richat/08", "img/richat/09", "img/richat/10", "img/richat/11", "img/richat/12", "img/richat/13", "img/richat/14", "img/richat/15", "img/richat/16"], "th": "_t.jpg", "tags": {"img/richat/01": "Nouadhibou (Mauritania)", "img/richat/02": "Nouadhibou (Mauritania)", "img/richat/03": "Nouadhibou (Mauritania)", "img/richat/04": "Nouadhibou (Mauritania)", "img/richat/05": "Terjit, Atar (Mauritania)", "img/richat/06": "Terjit, Atar (Mauritania)", "img/richat/07": "Terjit, Atar (Mauritania)", "img/richat/08": "Terjit, Atar (Mauritania)", "img/richat/09": "Terjit, Atar (Mauritania)", "img/richat/10": "Terjit, Atar (Mauritania)", "img/richat/11": "Ouadane (Mauritania)", "img/richat/12": "Ouadane (Mauritania)", "img/richat/13": "Chinguetti (Mauritania)", "img/richat/14": "Chinguetti (Mauritania)", "img/richat/15": "Chinguetti (Mauritania)", "img/richat/16": "Chinguetti (Mauritania)"}, "drift": "The ore train crosses the desert at night, and the people riding on top of the ore count the stars to know where they are. One night a boy counted one too many. The others counted after him and found it too. By morning it had moved to stand above the Eye and stayed there. The satellites list it as a calibration error.", "dmode": "h"}, "PATERNOSTER": {"s": "City of London", "b": "The square is named after the rosary makers who sold their beads to the pilgrims of St Paul's. Paternoster, our father, the first words of the prayer. Since 2004 the London Stock Exchange has been on the square.\n\nIn the middle stands a column of Portland stone, twenty-three metres high, with a gilded urn of flames on top. Next to it, a shepherd in bronze drives his sheep across the stone, a sculpture by Elisabeth Frink. The sheep never arrive.\n\nThe photographs show the square and the Isle of Dogs, once the houses of the dock workers, where the money is now counted that the prayer did not ask for.", "img": ["img/paternoster/01", "img/paternoster/02", "img/paternoster/03", "img/paternoster/04", "img/paternoster/05", "img/paternoster/06", "img/paternoster/07", "img/paternoster/08", "img/paternoster/09", "img/paternoster/10", "img/paternoster/11", "img/paternoster/12", "img/paternoster/13", "img/paternoster/14", "img/paternoster/15", "img/paternoster/16", "img/paternoster/17", "img/paternoster/18", "img/paternoster/19", "img/paternoster/20"], "th": "_t.jpg", "drift": "The rosary makers in the lane counted beads all day, and one of them, it is said, never stopped, even asleep. When he died he had reached a number nobody had a name for. His beads were melted down. On the square today one of the cash machines sometimes counts the notes twice before it hands them out, and nobody has ever reported it.", "dmode": "v"}, "SELECTED_FRAMES": {"s": "best of • forty frames • twenty spaces", "b": "Forty frames from twenty spaces, each picked twice: once by the shutter, once with a red pencil on the contact sheet.\n\nThe order changes with every visit. A frame opens large; its caption leads back to the series it came from.", "img": ["img/caucasus/05", "img/caucasus/19", "img/belarus/07", "img/belarus/11", "img/huellen/06", "img/huellen/16", "img/chisinau/04", "img/chisinau/24", "img/gornobadakhshan/10", "img/gornobadakhshan/23", "img/beograd/05", "img/beograd/18", "img/gagauzia/04", "img/gagauzia/23", "img/transnistria/10", "img/transnistria/16", "img/soroca/09", "img/soroca/10", "img/bam/16", "img/bam/20", "img/hasankeyf/01", "img/hasankeyf/05", "img/persia/09", "img/persia/12", "img/kurdistan/04", "img/kurdistan/17", "img/kutaisi/15", "img/kutaisi/24", "img/ukrajina/06", "img/ukrajina/07", "img/issykkul/01", "img/issykkul/12", "img/kyrgyzstan/05", "img/kyrgyzstan/16", "img/stans/03", "img/stans/24", "img/yazd/01", "img/yazd/11", "img/paternoster/11", "img/paternoster/13"], "th": "_t.jpg", "sel": [["CAUCASUS", "img/caucasus/05", "_t.jpg"], ["CAUCASUS", "img/caucasus/19", "_t.jpg"], ["BELARUS", "img/belarus/07", "_t.jpg"], ["BELARUS", "img/belarus/11", "_t.jpg"], ["COCOONS", "img/huellen/06", "_t.jpg"], ["COCOONS", "img/huellen/16", "_t.jpg"], ["CHIȘINĂU", "img/chisinau/01", "_t.jpg"], ["CHIȘINĂU", "img/chisinau/04", "_t.jpg"], ["GORNO-BADAKHSHAN", "img/gornobadakhshan/04", "_t.jpg"], ["GORNO-BADAKHSHAN", "img/gornobadakhshan/16", "_t.jpg"], ["BEOGRAD", "img/beograd/05", "_t.jpg"], ["BEOGRAD", "img/beograd/18", "_t.jpg"], ["GAGAUZIA", "img/gagauzia/04", "_t.jpg"], ["GAGAUZIA", "img/gagauzia/23", "_t.jpg"], ["TRANSNISTRIA", "img/transnistria/10", "_t.jpg"], ["TRANSNISTRIA", "img/transnistria/16", "_t.jpg"], ["SOROCA", "img/soroca/09", "_t.jpg"], ["SOROCA", "img/soroca/10", "_t.jpg"], ["BAM", "img/bam/16", "_t.jpg"], ["BAM", "img/bam/20", "_t.jpg"], ["HASANKEYF", "img/hasankeyf/01", "_t.jpg"], ["HASANKEYF", "img/hasankeyf/05", "_t.jpg"], ["PERSIA", "img/persia/09", "_t.jpg"], ["PERSIA", "img/persia/12", "_t.jpg"], ["KURDISTAN", "img/kurdistan/04", "_t.jpg"], ["KURDISTAN", "img/kurdistan/17", "_t.jpg"], ["KUTAISI", "img/kutaisi/15", "_t.jpg"], ["KUTAISI", "img/kutaisi/24", "_t.jpg"], ["UKRAJINA", "img/ukrajina/06", "_t.jpg"], ["UKRAJINA", "img/ukrajina/07", "_t.jpg"], ["ISSYK-KUL", "img/issykkul/01", "_t.jpg"], ["ISSYK-KUL", "img/issykkul/12", "_t.jpg"], ["KYRGYZSTAN", "img/kyrgyzstan/05", "_t.jpg"], ["KYRGYZSTAN", "img/kyrgyzstan/16", "_t.jpg"], ["STANS", "img/stans/03", "_t.jpg"], ["STANS", "img/stans/24", "_t.jpg"], ["YAZD", "img/yazd/01", "_t.jpg"], ["YAZD", "img/yazd/11", "_t.jpg"], ["PATERNOSTER", "img/paternoster/11", "_t.jpg"], ["PATERNOSTER", "img/paternoster/13", "_t.jpg"]]}},W={"HOTEL_HILBERT": {"t": "hotel_hilbert", "s": "lost footage, probably 2016", "cr": "a film by Marlene Wetzel & Max Soroca\nafter Jorge Luis Borges, »August 25, 1983«\nBorges: Dietrich Kuhlbrodt\nreceptionist, dream figure: Helena Hauff\ncamera: Marlene Wetzel, Lydia Leerstelle, Verena Ledig, Dustin Leitol, Max Soroca\nsound recording: Dustin Leitol\nsound: Tobias Wenzel\nmusic: LoeLoe Yalla\nediting: Max Soroca, Sebastian Kökow, Marlene Wetzel\nset, costume, make-up: Marlene Wetzel, Helena Hauff", "b": "Dietrich Kuhlbrodt plays Borges. He walks along the water with a suitcase, up a path between hedges, to a hotel he knows well. Helena Hauff is behind the counter. She does not recognise him and pushes the guest book across. His name is already in it, the ink still wet. The other gentleman, she says, looks just like you, only older. He has taken room 19.\n\nBorges published the story in 1980 and dated it ahead: 25 August 1983, the day after his eighty-fourth birthday. In room 19 a younger Borges finds the older one, dying. Each of them thinks he is dreaming the other. In the film the room turns red, a magpie lands, the library and the labyrinth come back, and in the end everything goes out into the stars.\n\nEvery room is taken. There is always room for one more guest.\n\nThe 25th of August is the last day the world turned without me. If a world goes out when the one who sees it closes his eyes, where does the day go that came before he opened them?", "img": ["img/hotel_hilbert/f01", "img/hotel_hilbert/f02", "img/hotel_hilbert/f03", "img/hotel_hilbert/f04", "img/hotel_hilbert/f05", "img/hotel_hilbert/f06", "img/hotel_hilbert/f07", "img/hotel_hilbert/f08", "img/hotel_hilbert/f09", "img/hotel_hilbert/f10", "img/hotel_hilbert/f11", "img/hotel_hilbert/f12", "img/hotel_hilbert/f13", "img/hotel_hilbert/f14", "img/hotel_hilbert/f15", "img/hotel_hilbert/f16"], "ghost": "Maria Kodama\n\nSehr geehrte Frau Kodama!\n\n{ow:N|M}ein Name ist Max Soroka. Ich wurde am 26. August 1983 geboren.\n\nDer 25. August 1983 war der *letzte* Tag dieser Welt, an dem ich noch nicht ~~hier war~~ selbst hier weilen durfte. Gab es diesen Tag überhaupt? Oder beginnt und endet die Welt mit dem eigenen Erscheinen und *Verschwinden*?\n\nEin alter Freund hat ~~sich selbst~~ den Borges gespielt. Er sagte: Nein, ich will den Borges spielen!\n\nIch habe mich bis heute nicht getraut, um Entschuldigung zu bitten.\n\nEin Hotel mit unendlich vielen Zimmern, restlos ausgebucht. Doch mit einem Mal erscheint ein weiterer Gast.{p} Was also tun?\n\nMit freundlichen Grüßen,\n*Max* ~~Soroka~~ Saroka", "th": "_t.jpg", "ext": ["hotel-hilbert-text.html", "what was probably said in room 19"]}, "FAG_BUTTS_IN_THE_FIRE_BUCKET": {"t": "fag_butts_in_the_fire_bucket", "s": "music video · Helena Hauff · 2018", "cr": "directed by Max Soroca & Vanessa Ivan\ncommissioned by Ninja Tune", "b": "In June 2018 they filmed a woman on a heath that had turned violet. She has since gone through the frames one by one and cannot say whether the colour was added later or was already in the heather when they arrived.\n\nTwo films were cut from the same material. The first was delivered, approved and released under another name. The second she kept in a bucket of the kind that hangs beside the doors of old houses, for the cigarette ends of guests. She mentions the bucket because it is the only object in this account of which she is certain.\n\nYears later she took the second film out and counted its frames. There were one hundred and ninety-two. The following evening there were fewer; on the third, more. She wrote the numbers down. They do not add up, and she has stopped expecting them to.\n\nOn Helgoland it is said that when someone drowns, something climbs out of the sea: black, with eyes the size of plates and a coat of sheepskin. It does not walk; it rolls. It lies across stairs and in the corners of barns. When misfortune has come to a house, the islanders say: Det bisterk Ding lag auf dem Weg.\n\nShe does not claim the two are connected. She only notes that on the night she first counted the frames, something was lying on her stairs, and that she stepped over it.", "mos": {"src": "img/fag_butts/mosaik.jpg", "c": 16, "r": 12, "base": "img/fag_butts/"}, "qualm": ["…shall be entitled to require you to deliver an ███████████ version…", "…███████ the services of Max Sarcka as the director ████████…", "…██████████████████████████ in perpetuity ███████…", "", "[ page 4 of 6 ]"]}, "BUBBLE_BOY": {"t": "bubble_boy", "s": "music video · The Pink Elephants · 2019", "cr": "directed by Max Soroca", "b": "It began with a few lines typed into a phone on an August evening in 2018. The phone did not know a single word of them and underlined every one in red.\n\nA month later a small crew drove through Athens and Piraeus with a list: streets through the windscreen, through the rear window, from the side; a playground near the central station; a fire in Exarchia, if it could be had. Beside the bubble the notes say only: artificial, afterwards?\n\nThe bubble never came, and neither did the boy. What stayed is a young woman in a tiger-striped top on a street, a dance in front of a grey wall that leaves copies of itself in the air, a city seen through smeared glass, a storm standing over the mountains behind the houses.\n\nAt the end a street of parked cars folds into itself, turns round like a kaleidoscope and closes. Perhaps that is the bubble after all, the round shape the film draws around her in its last minutes.", "img": ["img/bubble_boy/04", "img/bubble_boy/12", "img/bubble_boy/03", "img/bubble_boy/14", "img/bubble_boy/08", "img/bubble_boy/17", "img/bubble_boy/09", "img/bubble_boy/16"], "bubble": "August 10, 2018 · 9:08 PM", "th": "_t.png", "mos": {"src": "img/bubble_boy/bubble.jpg", "base": "img/bubble_boy/m/", "pts": [[0.5318, 0.5], [0.4617, 0.5351], [0.5058, 0.434], [0.5475, 0.5619], [0.4132, 0.4846], [0.5821, 0.4478], [0.4726, 0.602], [0.4478, 0.3994], [0.6132, 0.5414], [0.3823, 0.5486], [0.5567, 0.3788], [0.5419, 0.6336], [0.3737, 0.4268], [0.6481, 0.4675], [0.4096, 0.6285], [0.4791, 0.339], [0.6281, 0.608], [0.3277, 0.5071], [0.6257, 0.3749], [0.4916, 0.6818], [0.3805, 0.3567], [0.6894, 0.5255], [0.3396, 0.6116], [0.5439, 0.3052], [0.6014, 0.6769], [0.3018, 0.4368], [0.6925, 0.4111], [0.4166, 0.6992], [0.4256, 0.2931], [0.698, 0.6041], [0.2801, 0.5579], [0.625, 0.3056], [0.5397, 0.7313], [0.3116, 0.3541], [0.741, 0.4801], [0.3334, 0.68], [0.5013, 0.2513], [0.6693, 0.6867], [0.2457, 0.4764], [0.7061, 0.3436], [0.4531, 0.7577], [0.3588, 0.2756], [0.7588, 0.571], [0.2585, 0.6239], [0.5955, 0.2426], [0.6046, 0.7571], [0.2464, 0.3798], [0.7711, 0.4165], [0.355, 0.7472], [0.4393, 0.2169], [0.7384, 0.6694], [0.2069, 0.5365], [0.6933, 0.273], [0.5109, 0.8008], [0.2868, 0.2836], [0.8061, 0.5157], [0.2615, 0.6969], [0.5432, 0.191], [0.6784, 0.7592], [0.1907, 0.4288], [0.7785, 0.3423], [0.4004, 0.8069], [0.3651, 0.204], [0.8018, 0.6281], [0.1885, 0.6102], [0.6564, 0.2061], [0.5838, 0.8249], [0.2166, 0.3157], [0.8359, 0.4441], [0.2886, 0.7701], [0.4733, 0.1556], [0.7541, 0.7375], [0.1497, 0.4965], [0.7624, 0.2644], [0.4654, 0.8534], [0.2854, 0.2141], [0.8537, 0.5662], [0.1925, 0.6913], [0.5982, 0.149], [0.6658, 0.8272], [0.1546, 0.3699], [0.8447, 0.3618], [0.3382, 0.8368], [0.3911, 0.1402], [0.8252, 0.6929], [0.1277, 0.5779], [0.7232, 0.1893], [0.5456, 0.8821], [0.2066, 0.2476], [0.889, 0.4879], [0.2198, 0.7732], [0.5222, 0.1072], [0.7504, 0.8063], [0.1064, 0.443], [0.8305, 0.275], [0.4078, 0.8912], [0.3027, 0.1474], [0.8857, 0.6274], [0.1277, 0.6674], [0.6622, 0.1231], [0.6356, 0.8894], [0.1352, 0.3035], [0.9037, 0.398], [0.2701, 0.8496], [0.433, 0.0849], [0.8314, 0.7621], [0.0767, 0.5307], [0.7928, 0.1899], [0.4935, 0.9284], [0.2141, 0.1783], [0.9301, 0.5443], [0.1514, 0.759], [0.5825, 0.0716], [0.7296, 0.8732], [0.0768, 0.3793], [0.8953, 0.3022], [0.3414, 0.9146], [0.3361, 0.0854], [0.9026, 0.6959], [0.069, 0.6281]], "rad": 0.0364}, "bnote": "img/bubble_boy/note.png"}, "INSANE_IN_THE_BRANE": {"t": "insane_in_the_brane", "s": "on the quest for reality · documentary essay · 2020", "cr": "an idea by Max Soroka\nnarrated by Alexa Materna\nmade without a budget, with master's students in media studies at TU Berlin", "b": "A woman called Alexa set out to find out whether the world is real. She began in a cave, because that is where the question begins, and climbed out into the Allgäu, to the village where Konrad Zuse once lived and wondered whether space itself might be calculating.\n\nThe son of the man who built the first computer told her that it might. A professor of artificial intelligence thought the universe too large to be simulated. A theorist of glitches, a pataphysician who has no brother, a parapsychologist and a sheikh each answered a different question.\n\nSomewhere in the film a person stares at a blue summer sky until they find a pixel in it. Nobody has explained that pixel.\n\nThe copy kept here measures 176 by 144 pixels and runs for sixty-eight minutes and forty-six seconds.", "img": ["img/insane/01", "img/insane/02", "img/insane/03", "img/insane/04", "img/insane/05", "img/insane/06", "img/insane/07", "img/insane/08", "img/insane/09", "img/insane/10", "img/insane/11", "img/insane/12"], "pixel": "Well, I do spot a pixel there.", "book": ["Where...am I? What's that all? Am I in a cave? Or am I just a shadow in a cave? And what am I? Am I even real? And if so, what is reality basically?", "Hi. I'm Alexa. I'm currently on the quest for reality. Do you like to join me? I am often wondering what everything is about and what it means to be here. About what is holding the world together. In its inside but also in its outside.", "And the role of us human beings in that. Just a minute ago, I was in a dark, sort of scary place. Comparable to Plato's Allegory of the Cave. There he describes that we may just sit inside a cave without being able to perceive reality but only shadows of things passing by. Not much uplifting, such an idea. I better get back to light.", "To nature. To the mountains. Here in Allgäu - In Hinterstein to be precise, was living Konrad Zuse, the inventor of the computer, for some years after World War II. He is also considered as one of the forerunners of Digital Physics. This postulates that the cosmos is finite and therefore countable. In his paper Calculating Space Zuse even claims the universe itself might be a gigantic computer.", "Now I'm a bit confused. But let us ask his son Horst Zuse straightforwardly. Well, Calculating Space, it implies the idea: How is the universe structured? The bits as the basic principle and smallest unit of information. This has been maintained until today. The bit lengths and the number of registers and memory sizes have changed but in general - and this is the astonishing thing about - computer are still working according to his principle.", "This idea haunted him. So if this is the basic unit of my machine, how is the universe structured then? There are also particles. There are also particles which are able to take two different stages: 0 and 1. And then it is the question of how do these particles correspond with each other? Can it be defined as 0 and 1 as well? If the universe consists of binary units which truly communicate with each other, I better ask that question in a different way: Isn't the universe a gigantic computer by itself if it really functions in that way?", "Thus he hypothesized the universe communicates with itself, that particles communicate with each other and hence creative processes can occur through this. So isn't the universe a gigantic computer then? Consisting of billions upon billions of very, very tiny processors? That can communicate with each other? The great success actually happened in 2006 when Deutsche Technikmuseum did a symposium on Calculating Space in honor to Konrad Zuse. That was when Seth Lloyd from MIT showed up saying in the end: \"Well, I didn't know so far that Konrad Zuse made a publication already in 1967 and 1969, which contained the topic we are dealing with now - the digital universe.", "But, ladies and gentlemen, that key question for all of you would be: Is he right or is he not right? Is the universe a gigantic computer?\" Suddenly It went dead silent and the answer was: Yes. He is right. It's not just a gigantic PC. It is a gigantic quantum computer.", "Every simulation is a simplification of reality. So the question is how much can I simplify that the answer of the computer is still useful or beneficial? Is it possible that the universe is a simulation? Like in Matrix? I don't think so because according to current discoveries of physics scales we are arguing with are very big up, which means the universe is incredibly huge but also scales downwards are incredibly vast. The smallest unit of time which can be represented is 10 to the power of -42.", "It can't be any smaller. We call it Uncertainty of Time, discovered by Max Planck. So this is the reason why there are so many orders of magnitude between the smallest and the largest in the universe that no computer today could even come close simulating an entire reality. Right, so lets take it serious. We we would need a gigantic computer. Every tiny compartement of the universe should be represented inside of this computer.", "Everywhere we look at must be something to detect. That computer must be way bigger than the universe. You will need an infinite number of electrons in storage units for simulating a single electron. This means that we can't be a simulation in our universe. But of course we can wonder if an incredible larger universe is existing somewhere containing a gigantic supercomputer, as gigantic and as fast we won't ever be able to build in our \"small\" universe. Whew.", "Lets take it slow. Therefore, the universe is a computer. But what was that simulation thing about? Do we exist inside of a world simulated by a future civilization? Like in a computer game? Raúl Rojas doesn't seem to believe in this.", "But other and also prominent people in science and technology rather do. For example Nick Bostrom, a Swedish bestselling writer and professor of philosophy at Oxford University. His so-called Simulation Hypothesis virtually transfers Plato's Allegory of the Cave into a more modern and techy version, so to speak. Lets rather ask a futurologist and writer of science-fiction novels to explain this idea. Well, he's tying this in with his thoughts on superintelligence: Saying that some kind of artificial intelligence will be developed on Earth in future. So we have to be prepared for the fact that there are artificial intelligences in the cosmos which are extremly superior to us.", "And that such an intelligence could simulate a whole cosmos. So he argues that either rational beings will never reach a state of development in which they produce real, high-level artificial intelligence or superintelligence. Or maybe, that, for some reason, those cannot exist in the universe or if such intelligences evolve, they can either start simulating - that is, to build other beings of intelligence in extra worlds or not. He considers the latter to be improbable. He suspects that these artificial intelligences - from now on I'll call them Cosmic Superintelligences - so when these Cosmic Superintelligences are able to build up simulated worlds and within these simulated worlds would evolve new simulating superintelligences, so that you would find whole hierarchies of simulated worlds and then on the other hand, it would be obvious that we don't live in the one true world which created the first super intelligence but somwhere far out in the hierachy of derived simulated worlds. Wow.", "Nice, very nice. So what is this showing us? It is showing us something about technology, so that we believe we could develop such technology for simulating whole worlds. This is showing us a lot about our times, when we develop the idea of thinking to live in a simulation. So in that respect it is meaningful. In our universe It simply is the case that there is a lower limit, indicated by Quantum physics.", "Furthermore, the universe is finite - this is indicated by regular physics which is making it hard to achieve in our universe. But in case you imagine the universe with some extra dimensions - so there would be more space to build such of a computer and the true universe within such a computer could be built is a continuous one instead of a discrete one like in quantum physics, so it could be conceivable for the time being. The idea that one is living in a computer game, in reality, that someone is simulated or whatever you like to call it, could you imagine something like that?", "Of course I can imagine something like that, but I wouldn't like to live in a computer world. I can imagine anything. But I live in our world using my five senses and my mind and of course I cannot perceive the dance of the atoms, I intellectually understand how complex life is. But the world I experience with my senses is a true one. and simulated worlds attract me in cinema only. I could do a little test. I'll be very fast doing this.", "Trying to check if the computer which is running the simulation is able keep up. Let me try again. Zack. The computer are either very, very powerful. Or it is real after all. This might be all true by itself.", "But does it convince us? Personally, it does not seem to be watertight for me. But neither I could disprove it. Or can I? Or is it only theatre? Cinema? Spectacle? After all, this question has been on our minds since primeval times, since we have been able to think and reflect on ourselves.", "Creating an image of reality seems to be as ancient as human culture. Whether in prehistoric cave paintings, in Greek tragedies or in dystopian sci-fi-novels and nowerdays in cinema and virtual reality. The idea of simulation may solely be a web of popular culture. So let's ask two clever people who will for sure have a lot to say on that. Appropriately enough, both share almost the same name. So who is simulating whom in here basically?", "We can talk about that for very long time - of course on a quite abstract and theoretical level - whether what I can see is real or not meaning: Could it be an illusion somehow? That is an old philosophical debate. For example Déscartes has already considered in a very famous thought experiment if the world could merely be a delusion of a malevolent demon?", "Later it became the idea of the Brain in a vat and movies like Matrix, Vanilla Sky, Open Your Eyes and so on. In terms of film history, the idea of cyberpunk was a paradigm shift towards the way science-fiction was discussed in film. Earlier, science-fiction was more clean, very white, very positively progressive, even if aliens were attacking. But with the idea of cyberpunk, some kind of Film noir has come back whichs means that there is a dark world in which a lost and lonely hero is fighting with a crushing superiority which determines daily life. Blade Runner can definitely be taken as the protoype cyberpunk movie. In the early 1990s the element of virtual reality was added and in my opinion everything culminated in Matrix, shot by the Wachowski sisters back then.", "(Brothers at that time) Brothers at that time, right. The idea falls back to Fassbinder's World on a wire and the novel on which the movie was based, the idea that someone is living within a simulation. It took visually a lot of what the cyberpunk genre has been laying down over the last 15 years, i.e. a dystopia which is encoded often in a critical way towards capitalism pointing that the all-dominant social structures capturing people within a sort of spectacle without letting them think about it and therefore not letting humans break free what is perhaps the realphilosophische idea behind the whole thing. There is this thought experiment by Robert Nozick in which you are asked to have take opportunity of being connected to a so-called \"experience machine\". Once connected you will be in a completely simulated world. What is making his version of that thought experiment special is that it will be an absolutely wonderful and fantastic world.", "Whatever you need - it will be fulfilled and you will become totally happy. He has asked many people if they like to be connected to that machine. But many people said no. And if you're thinking about the reason why they did so, you will understand that humans are not only concerned about being happy in their lifes. But we are rather keen on living an authentic life. Not like wearing a mask with what we disguise ourselves in daily life, taking on some persona, some fake identity, but contributing ourselves through our authentic self into authentic contexts where other people appear theirselves in a way.", "Yet I do think we are living in a simulation which appears like truth for us. I think it's a plausible theory, that will perhaps be verified by the year of 2200. Of course it is possible that everything is simulated. And the higher power or higher force is maybe be the only truth. All the characters of World on the Wire and Simulacron-3 do think they would live in the \"true\" world. Through a twist in the story and its entanglements, that our main character finds out to be just a character in a simulation.", "Means we've layered simulation on simulation and that's probably where we are close to Plato's Allegory of the cave, to what extent you are able perceive what's real. That is to say, even if the upper level would be reached again, that is, the simulation, in which we know that it is even controlled beyond that - so who can tell us that what is intervening from above is actually real, or yet another simulation? So whoever is installing those simulators or whatever, doesn't interest me either. I don't know either how ecstasy is produced. I only know that ecstasy is also taking me to another world. If you are staring at the blue summer sky, staring at very exact, then you can try to check if the colored dots are basically pixels.", "Are they pixels? Well, I do spot a pixel there. No idea why. When we think of computer games and argue that these are virtual and simulated worlds as well, we would have to say all glitches and bugs indicate that we are living within a simulation. If our world is to be a simulation, we should be able to observe glitches and bugs here as well. So we also ought to observe errors within our world.", "It is maybe a matter of opinion. Well, I guess that almost everybody already experienced something like: Something can't be true seeming like a weird coincidence, there must be something behind - so it would represent something. Or something trivial like when you are walking in the streets while noticing someone you know. But then you realize it wasn't the person you thought of though five minutes later you meet the person nevertheless. A precursor was sent! Something like that could be such a typical glitch in a computer simulation, showing that the software didn't work correctly.", "If we could determine this on a physical level, we would have a certain proof that we are inside a simulation. In this case we would have to contact The Institute for Frontier Areas of Psychology and Mental Health at the University of Freiburg where scientists work with anomalistic methods to collect such phenomena. Yes, it is an exciting topic. Ok, so let's call them. People are for example frequently reporting a precognitive encounter. Most of them can be linked to particular situations of crisis.", "For example when a person forsees a particular person dying. Or people report inexplicable object movements - even of large objects. Such moments can be quite disturbing so that some people have trouble to integrate this into their existing view of the world. That for we have a consulting service at our institute. For example one appropriate way to explain might be, to say, well, in such moments when a large object seems to move inexplicably - those objects are frequently associated with a particular meaning for this person for a certain period of time, for a moment. Here seems to be kind of entanglement correlation between the person and the environment or co-world.", "This can mean psychological tensions that have not been lived out could be released in this way into environment. This can be very similar to psychosomatic illnesses. The question of what's real is posed either in dreams as in simulations. In that sense, Zhuang Zhou's Butterfly Dream was an important discovery for me. It goes like - Zhuang Zhou is dreaming he's a butterfly flying from blossom to blossom. Later he wakes up being Zhuang Zhou.", "Asking himself: But maybe I am still this butterfly who thinks to be Zhuang Zhou. This means that we don't even know if we truly are ourselves or if we are just a simulation of ourselves. Or someone else's dream. In the past it was supposed to be the dream of god or of a butterfly. It often was linked with the particular media of these times. During times when the most exciting media for the people was theatre, the simulated world was imagined in a theatrical way, so to speak.", "Or gods are watching us and we do a drama performance for them in which they perhaps intervene a bit. I think we're not getting anywhere at this point. Olaf Müller is spotting pixels in the sky but has no idea why. Everybody is talking about these glitches and bugs. There are even whole scientific institutions investigating frontier and parascience phenomena. It seems to be the right moment - the Kairos in the words of Ancient Greeks and Plato, to take matters into our own hands.", "Luckily we got Brian helping us. He is, lets say, zombie'pataphysicist and invites us to a cybernetic seance. We gather in the anechoic chamber. Or Dead Room in other words. Can we find a glitch in there? Or can we even get in touch with a simulator? Be careful not stepping on it.", "We are neither dead nor alive. We are neither there nor not there. We are in the twilight of death and life. We are beings of the shadow. If He does not exist, thus we do not exist either. We are shadows of God.", "You will recognize reality only when once you are dead. Die before you are dead. Only the dead know what reality is. Those who think to be alive in this world have no idea of reality. No matter what kind of professor they are. Anything they have studied at schools is not real either.", "Neither knowledge is. Anything that disappears cannot been real. Some spiritual leaders maintain that God would be inside of them. They taste a bit of truth, but they interpret and identify it throug
