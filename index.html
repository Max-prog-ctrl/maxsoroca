ll there, but no one would take a second walk.", "%2463", "@UNBEKANNT|So that's kind of like the the machine's purpose of being kind of. Okay. Very nice. Okay.", "#The recording ends. In the other mode it starts again."], "bookt": "after the end", "bookl": "read the transcript", "clock": 2475, "cloop": 1, "clockl": "read it as a loop"}, "ALBRECHT_BEUTELSPACHER": {"t": "albrecht beutelspacher", "s": "conversation · ∞", "b": "A mathematician who built a museum in which one is allowed to touch the numbers.\n\nThe conversation was about secrets: how to write a message that only the right person can read, and what it means that almost every cipher can be broken, given enough time. Time, it turns out, is the real key.\n\nThis page is written in a code. It will open if one waits.", "cipher": true}, "WILLI_XYLANDER": {"t": "willi xylander", "s": "conversation · April 2022", "b": "Under a single footstep in a forest live more animals than anyone would care to count: mites, springtails, worms that have never been given a name. He has spent his life with them.\n\nThe conversation asked who we are, measured against the soil: a species that imagines itself at the centre and is carried, every day, by creatures it cannot see and does not thank.", "mites": true}, "ROSA_MENKMAN": {"t": "rosa menkman", "s": "talk · eclipse residency · summer 2026", "b": "She spoke about the visible and the invisible, about glitches and ghosts: the moment a technology stops hiding and shows what it actually is.\n\nA resolution is a decision about what may be seen. Everything it leaves out does not disappear; it goes on existing just below the threshold, waiting for a fault to let it through.\n\nFor a residency built around an eclipse, which shows the sun by covering it, there was no better way to begin.", "glitch": true}, "PLURIVERSUM": {"t": "pluriversum", "s": "Alexander Kluge · 2017", "b": "A book that does not want to be read from the front. It consists of stories, notes, conversations and fragments, and each of them is a door into a room that has other doors.\n\nKluge writes that the soul is a creature that lives under water, liquid and always changing, and that it needs places to work in. The reader underlined the sentence and wrote a question beside it: a Turritopsis dohrnii? The jellyfish that grows young again when it is old.\n\nEisenstein, the book reports, wanted spherical films. Most films still tell the same flat story with the illusion of space. The reader underlined that too, and then made films that do not run in a line.", "ul": ["Die Seele ist ein Unterwasserwesen.", "Menschen hausen in ihren Lebensläufen.", "Irgendwo im Bild muss es schwarz sein, irgendwo weiß"], "pen": "red"}, "DIE_ORDNUNG_DER_ZEIT": {"t": "die ordnung der zeit", "s": "Carlo Rovelli · 2017", "b": "Time loses its layers one by one in this book, the way an onion does. First its unity: a clock in the mountains runs faster than a clock by the sea. Then its direction: the laws of motion do not know past from future, only heat does. Then the present itself: there is no same moment across the universe.\n\nWhat remains is a world of events, not of things; kisses, not stones.\n\nIn the margin, next to the passage on how blurred our view of the world is, the reader wrote two words in brackets: an Aleph? A point from which the future and the past would look the same.", "ul": ["Die Zeit hat ihre erste Schicht verloren: ihre Einheitlichkeit.", "Für alles, was sich bewegt, läuft die Zeit langsamer ab.", "„denselben Augenblick“ gibt es im Universum nicht."], "pen": "pencil"}, "KOSMISMUS": {"t": "kosmismus", "s": "Boris Groys, Anton Vidokle (Hg.) · 2018", "b": "In 1915, in Petrograd, Malevich hung his Black Square high in the corner of the room, where a Russian family hangs its icon. The square looked down at the visitors at a slight angle.\n\nThe Russian Cosmists, a few decades earlier, had wanted more than an icon. Nikolai Fyodorov wrote that humanity's common task was to raise all the dead, every ancestor, bodily, and to settle them on other planets because the earth would be too small. Only then, he thought, would there be a just society, since war makes no sense among the immortal.\n\nThe future, in this book, is replaced by the reconstruction of the past. Time runs between the generations, not forward.", "ul": ["Entstanden waren schwarze Ikonen.", "An die Stelle des Traums von der Zukunft tritt die Rekonstruktion der Vergangenheit.", "Es entsteht eine kosmische Jetztzeit"], "pen": "blue"}, "DAS_UNIVERSUM_IN_DEINER_HAND": {"t": "das universum in deiner hand", "s": "Christophe Galfard · 2015", "b": "The book addresses its reader as you and takes you along: into the heart of the sun, more than half a million kilometres below its surface, across the galaxy, into the first second.\n\nIf the sun were a watermelon, the earth would stand some forty metres away from it, and you would need a magnifying glass to see it. The light you see left the sun eight minutes and twenty seconds ago.\n\nIt also tells you that the sun is a star of the second or third generation. One or two generations of stars had to explode so that their dust could become the sun, the earth and the hand that holds the book.", "ul": ["Licht benötigt ungefähr acht Minuten und zwanzig Sekunden", "denn im Weltall gibt es weder unten noch oben", "Eine oder zwei Generationen Sterne mussten explodieren"], "pen": "red"}, "DIE_ENTDECKUNG_DES_UNMÖGLICHEN": {"t": "die entdeckung des unmöglichen", "s": "John D. Barrow · 1998", "b": "A book about the walls of knowledge: what cannot be known, cannot be computed, cannot be built. Zeno's Achilles who never reaches the tortoise. Maxwell's demon, sorting molecules in a box until someone noticed that knowing costs heat. Escher's staircases, which can be drawn and not walked.\n\nThe Pythagoreans, Barrow writes, believed that numbers were the bond of the universe, and that everything that carries the same number is connected to everything else that carries it.\n\nThe reader underlined the sentence about our senses, which reduce the world so that we can bear it, and the one about our ability to think the impossible, which seems to be the oddest of our abilities.", "ul": ["Logische Beschreibungen komplexer Welten tragen in sich den Keim ihrer eigenen Begrenzung.", "zuviel Realität halten wir nicht aus", "unsere Fähigkeit, Unmögliches zu denken"], "pen": "pencil"}, "UR_UND_ANDERE_ZEITEN": {"t": "ur und andere zeiten", "s": "Olga Tokarczuk · 1996", "b": "Ur is a village at the centre of the universe, guarded by four archangels at its four borders. Time passes in it as it passes everywhere, but slower, and one can watch it.\n\nIn Ur, as everywhere in the world, there are places where matter creates itself out of nothing, small crumbs of reality that change nothing. And there is a place where reality shrinks and escapes like air from a balloon. After the war it opened in the fields behind the hill, a funnel that pulls yellow sand and stones downward, and nobody knows where to.\n\nThe reader copied only a few pages from this book. One of them is about a death: the old man's body, small and slack like an empty sack, with nobody in it any more.", "ul": ["In der Selbstvergessenheit liegt die Befreiung von Zeit und Tod.", "Jeder von uns irrt sich in wesentlichen Dingen.", "Orte, an denen die Materie sich selbst erschafft"], "pen": "blue"}, "UNSER_MATHEMATISCHES_UNIVERSUM": {"t": "unser mathematisches universum", "s": "Max Tegmark · 2014", "b": "The book's claim is that the world does not merely obey mathematics but is a mathematical structure, and that every consistent structure exists somewhere, as its own universe. Four levels of parallel worlds, the last one containing all the others.\n\nOn the way there, it collects things that sound like fairy tales and are physics. Trees consist mostly of air, which returns to the air when they burn. Steel is mostly empty space. Cooled far enough, liquid helium flows upward, out of its glass.\n\nThe reader underlined a sentence about the multiverse in the first person: it seems there will always be at least one parallel universe in which I never die.", "ul": ["Bäume bestehen hauptsächlich aus Luft.", "ein Paralleluniversum geben, in dem ich niemals sterbe.", "Bei niedrigen Temperaturen kann flüssiges Helium aufwärts strömen."], "pen": "highlighter"}, "DIE_KOSMISCHE_SCHLANGE": {"t": "die kosmische schlange", "s": "Jeremy Narby · 1995", "b": "An anthropologist lives with the Asháninka in the Peruvian Amazon and asks how they know which two plants, out of tens of thousands, must be boiled together for hours to make ayahuasca. One contains a substance that the stomach destroys, the other contains what stops the stomach from destroying it. The answer he gets is: the plants told us.\n\nHe takes the answer seriously. Shamans everywhere speak of a ladder that connects heaven and earth, a liana, a rope, a spiral staircase, two intertwined snakes. He sets the double helix beside them.\n\nThe reader followed the book as far as the ladder and drew an arrow in the margin: they believe the gods came down by it.", "ul": ["einer Leiter - oder einer Liane, einem Seil, einer Wendeltreppe", "ein saman ein Mensch, der eine Trommel schlägt, in Trance fällt und Leute heilt", "sprechen eine „geheime Sprache“"], "pen": "red"}, "DAS_KONNEKTOM": {"t": "das konnektom", "s": "Sebastian Seung · 2012", "b": "The question is whether you are your connections. A connectome is the complete map of every link between the neurons of a nervous system, as a genome is the complete sequence of letters in the DNA.\n\nThe first to be drawn in full was that of a small worm, which has no brain, only neurons running through its body. Every one of them has a name and a place, and every worm has the same ones.\n\nA human brain has around a hundred billion neurons. The book calls the task of neuroscience the taming of the jungle of the mind. The reader underlined the jungle and left the taming alone.", "ul": ["den Urwald des Geistes zu zähmen.", "Der Fadenwurm hat kein Gehirn.", "Das Gehirn enthält 100 Milliarden Neurone."], "pen": "pencil"}, "GÖDEL,ESCHER,BACH": {"t": "gödel,escher,bach", "s": "Douglas R. Hofstadter · 1979", "b": "An endless braid: a theorem that says of itself that it cannot be proven, a hand that draws the hand that draws it, a canon whose voice climbs one step with each repetition and arrives, after six, where it began, an octave higher.\n\nThe book begins with Bach at the court of the King of Prussia, asked to improvise a six-part fugue on the king's theme, which it compares to playing sixty games of blind chess at once and winning them. Bach improvised three parts, went home, and later sent the king six, with riddles attached.\n\nThe reader copied the passage on the hardest kind of copy, the one that plays the theme backwards and still keeps every piece of information in it.", "ul": ["Eine achtstimmige Fuge zu improvisieren übersteigt die menschlichen Fähigkeiten.", "Die schwierigste „Kopie“ ist die rückläufige", "Alle Kanonrätsel sind gelöst worden."], "pen": "blue"}, "WAS_IST_LEBEN?": {"t": "was ist leben?", "s": "Erwin Schrödinger · 1944", "b": "In Dublin, in the middle of the war, a physicist gave three public lectures on a question that was not his. How can the small and the orderly survive in a world that tends to disorder?\n\nHe guessed that the carrier of heredity must be an aperiodic crystal, a structure that does not repeat and can therefore hold a message. Nine years later the double helix was found, and some of the people who found it said they had started with his book.\n\nThe reader also copied Lord Kelvin's image. Mark every molecule in a glass of water, pour it into the sea, stir all seven oceans, draw a new glass anywhere: about a hundred of the marked ones will be in it.", "ul": ["aperiodisches Kristall", "immer noch ungefähr hundert gekennzeichnete Moleküle finden.", "Die Atomdurchmesser liegen zwischen 1 und 2 ÅE."], "pen": "red"}, "ES_GIBT_KEINE_MATERIE!": {"t": "es gibt keine materie!", "s": "Hans-Peter Dürr", "b": "A physicist who worked with Heisenberg says that at the bottom of things there is no thing. There is relation, there is movement, there is what happens between. Once you turn reality into objects, a res, you destroy exactly the in-between that mattered.\n\nHe finds his allies in Advaita, the teaching of non-duality, and in Isaac Luria's Kabbalah, where God first withdraws into himself to leave space for creation.\n\nThe future, he says, is open; not arbitrary, but infinitely open. In each moment the next card is painted anew. The reader underlined it and, a few lines further down, the sentence that we can only know of God what he is not.", "ul": ["Die Zukunft ist offen.", "Eigentlich gibt es nur Bewegung.", "Wir können über Gott nur wissen, was er nicht ist."], "pen": "pencil"}, "WARUM_GOTT_DOCH_WÜRFELT": {"t": "warum gott doch würfelt", "s": "Marcus Chown · 2007", "b": "The title answers Einstein, who did not believe that God plays dice. The book says that he does, and that the dice are thrown in every atom.\n\nSqueeze the empty space out of all the atoms in all human bodies, and humanity fits into a sugar cube. An atom can be in two places at once. A particle does not know what it is until it is asked, and the question decides.\n\nThe reader marked the passage in which particles behave like waves and waves like particles, and the book's remark that this symmetry is, in a sense, all one needs to know about quantum theory.", "ul": ["in einen Raum von der Größe eines Zuckerwürfels", "gleichzeitig an zwei Raumstellen anwesend zu sein.", "Wellen sich wie Teilchen verhalten"], "pen": "highlighter"}, "IM_SPIEGEL_DER_SPRACHE": {"t": "im spiegel der sprache", "s": "Guy Deutscher · 2010", "b": "In 1858 William Gladstone, later prime minister of Britain, noticed that Homer never calls the sea or the sky blue. The sea is wine-dark, honey is green, and the sky is bronze. Gladstone concluded that the Greeks saw colours differently. His contemporaries did not know what to do with that.\n\nThe book follows the dispute for a hundred and fifty years: does language reflect the world, or does it shape what its speakers notice? Some languages have no words for left and right and speak only of north and south, and their speakers always know where north is.\n\nThe reader underlined the question in the middle of the book and did not write an answer next to it.", "ul": ["dass mit Homers Farbbeschreibungen etwas nicht in Ordnung ist.", "Ist die Sprache ein Artefakt der Kultur oder ein Vermächtnis der Natur?", "alle Erdlinge Dialekte derselben Sprache sprechen."], "pen": "blue"}, "DAS_GEHEIME_BEWUSSTSEIN_DER_PFLANZEN": {"t": "das geheime bewusstsein der pflanzen", "s": "Joseph Scheppach", "b": "A book that takes the plants at their word, or at their scent, which is their language. Their whole green surface is a single eye that sees more wavelengths than ours. A climbing plant moves towards the nearest pole, and if the pole is moved, it changes direction within hours.\n\nTomatoes, the book reports, sense a low-pressure system three days in advance and thicken their skin. Plants orient themselves by magnetic fields, as birds do.\n\nThe reader copied page after page from it and, among them, the plain sentence at the start that the young field of plant neurobiology says out loud: plants are intelligent.", "ul": ["Pflanzen sind intelligent.", "Tomaten spüren atmosphärische Tiefs drei Tage im Voraus", "Ihre Sprache sind Duftmoleküle"], "pen": "highlighter"}, "IT_BEGAN_IN_EPPELSHEIM": {"t": "it began in eppelsheim", "s": "mix · 78 min · October 2017", "b": "In 1835 a skull more than a metre long came out of a sand pit near Eppelsheim in Rhenish Hesse. It belonged to Deinotherium, a relative of the elephant whose tusks did not point forward but curved down, towards the ground in which it would one day be found.\n\nEvery beginning is dug out of something older. This one lasts seventy-eight minutes.", "snd": "https://archive.org/download/maxsoroca-mixes/eppelsheim.m4a", "tl": [[0, "MXLX – U Prick"], [222, "In Gowan Ring – Dream Reprise"], [429, "Delia Derbyshire – Pot au feu"], [562, "Krautzone – Superkraut II"], [1057, "Heimat – Trocadero"], [1201, "Brian Eno – Dow"], [1400, "Ariel Kalma – Trancing 1979"], [1556, "Khaled Kurbeh & Raman Khalaf Ensemble – Toska"], [1806, "Ali Kuru – Zorba the Greek"], [2422, "Jonathan Fitoussi & Clemens Hourriere – Five Steps"], [2844, "Demirci Hüso – Tayfun"], [2988, "Invinsible Church & Marie Davidson – Never Release the Tension"], [3324, "Satyricon – The Wolfpack"], [3562, "Teho Teardo & Blixa Bargeld – The Beast"], [3850, "Colleen – Winter Dawn"], [4112, "Kevin Shields & Brian Eno – Only Once Away My Son"]]}, "ES_IST_EIN_KRAUT_ENTSPRUNGEN": {"t": "es ist ein kraut entsprungen", "s": "mix · 94 min · November 2017", "b": "The old carol, first printed in 1599, sings of a rose that has sprung from a tender root in the middle of a cold winter.\n\nHere it is a herb instead. Kraut is what the English-speaking world called a whole generation of German music that refused to sound like anything before it. The herb sprang up a fortnight before Advent and grew for ninety-four minutes.", "snd": "https://archive.org/download/maxsoroca-mixes/kraut.m4a", "tl": [[0, "Der Räuber und der Prinz – Der elektrische Reiter"], [394, "Valerio Cosi – Affenstunde"], [827, "Rhytch – Nasty"], [1038, "Horns and Drums – Waka Wakah"], [1498, "Charles Cohen – Camera Dance"], [2227, "DJ DSL – Lovesick"], [2407, "I tpame I tvrame – Deserted"], [2598, "KP Transmission – Sand"], [3191, "DeepChord presents Echospace – Aequinoxium"], [3897, "No Zen Orchestra – Yuga (Sweet Meat)"], [4151, "Geist & The Sacred Ensemble – On the Next Full Moon"], [4455, "furniture – We Are We in Love"], [4669, "brunnen – Tiger Lily Girl"], [4935, "Gerry and the Holograms – Increased Resistance"], [5633, "Peter Power – Chakra Esoteria"]]}, "DIE_LETZTE_WELT": {"t": "die letzte welt", "s": "mix · 76 min · August 2018", "b": "In Christoph Ransmayr's novel a man named Cotta travels to Tomi, the iron town on the Black Sea where Ovid was exiled, to find the poet or at least his lost book of transformations. He finds neither. He finds the people of the town turning, one by one, into the figures of the book, and fragments of the text written on stones and rags.\n\nThe last world is the one in which every story has already happened and is happening again.", "snd": "https://archive.org/download/maxsoroca-mixes/letztewelt.m4a", "tl": [[0, "Cucina Povera – Huhuilu"], [183, "Los Bukis – Falso Amor"], [359, "Maria Rita – Cântico Brasileiro No. 3 (Kamaiurá)"], [589, "Lucrecia Dalt – Tar"], [897, "Wolf Müller & Niklas Wandt – Expedition"], [1490, "John Bender – 39A5 I Want to Be Loved for It"], [1736, "Marie Sans Délire – Threat Generator"], [1950, "Phantom Band – Nervous Breakdown"], [2243, "The Pink Elephants – Bubble Boy"], [2696, "Aurum Miles – Easy Come Easy Go"], [3097, "Joe Crow – We Said We Wouldn’t Look Back"], [3351, "Frische Farbe – Falsche Pläne"], [3729, "Mutter – Die Erde wird der schönste Platz im All"], [3936, "Emptyset – Completely Gone"], [4096, "Alien Alien feat. Igino – Perfidia"]]}, "INSIDE/OUTSIDE": {"t": "inside/outside", "s": "mix · 76 min · September 2018", "b": "A membrane has two sides and is a single thing. What is inside a cell is decided by a wall a few millionths of a millimetre thick, and the wall itself belongs to neither side.\n\nHeadphones are such a wall. Put them on, and the inside becomes very large.", "snd": "https://archive.org/download/maxsoroca-mixes/insideoutside.m4a", "tl": [[0, "May Roosevelt – Chasm (Tsamiko)"], [332, "In Atlas – Revolutionary Lover"], [655, "Bienoise – Meanwhile Tomorrow"], [702, "Tony Allen & Jeff Mills – The Seed (Edit)"], [1252, "DJ Oil – Héritage"], [1724, "Die Goldenen Zitronen – Wenn ich ein Turnschuh wär’ (Robag Wruhme Remix)"], [2021, "Cardi B – Bodak Yellow"], [2239, "Mogwai – Rano Pano"], [2540, "The Pink Elephants – Bubble Boy"], [2980, "Abyss X – L.A.S.H."], [3191, "Marie Davidson – So Right"], [3487, "Venus Volcanism – Pythia"], [3741, "Phantogram – When I Am Small"], [3971, "David Bowie – Blackstar"]]}, "STAN": {"t": "stan", "s": "mix · 76 min · October 2017", "b": "In Persian, stān is a place: the land where something stands, where a people stays. Afghanistan, Kurdistan, Hindustan, a whole map of endings.\n\nIn English it is a first name. Somewhere between the two, someone puts on a record and the place begins.", "snd": "https://archive.org/download/maxsoroca-mixes/stan.m4a", "tl": [[0, "Davlatmand Kho – در روی جهانيم و ندانيم جهان چيست"], [523, "Pakistani man playing traditional rubab – unknown"], [811, "The Gaslamp Killer with Amir Yaghmai – Nissim"], [1077, "Tinariwen – Sastanàqqàm"], [1276, "Khidja – Drums of Taksim"], [2013, "Muslimgauze – Algiers and Karachi"], [2727, "Eric Holm – Måtinden"], [3214, "Cevdet Erek – Flow 1"], [3409, "Pamiri music – unknown"], [4010, "Björk – Crystalline (Omar Souleyman Remix)"], [4400, "Elias Rahbani – Dance of Maria"]]}, "WE_EXIST_IN_A_TWILIGHT_IN_BETWEEN": {"t": "we exist in a twilight in between", "s": "mix · 59 min · 25 December 2018", "b": "Twilight has three stages, and each has its own name. Civil twilight lasts until the sun is six degrees below the horizon, nautical twilight until twelve, astronomical twilight until eighteen. After that it is night, or so the definitions say.\n\nOn Christmas Day, when the days are shortest, the twilight is long. This one lasts fifty-nine minutes.", "snd": "https://archive.org/download/maxsoroca-mixes/twilight.mp3", "tl": [[0, "Die Heiterkeit – Was passiert ist"], [203, "Marianne Faithfull & Nick Cave – The Gypsy Faerie Queen"], [402, "Tiamat – Do You Dream of Me?"], [597, "Twin Peaks – Windswept (Ambient Background)"], [960, "Manfred Krug – Niemand liebt dich so wie ich"], [1303, "Der Nino aus Wien – Es geht immer ums Vollenden"], [1568, "Yo La Tengo – Tears Are in Your Eyes"], [1837, "Julee Cruise – The Nightingale"], [1986, "The Space Lady – Capn Jack"], [2181, "Julia Holter – I Shall Love 2"], [2298, "Exploded View – Gimme Something"], [2579, "Mittekill mit Heim und Flucht Orchester – Herbsttag"], [2738, "Marie Davidson – Work It"], [2996, "DMX Krew – You Can’t Hide Your Love (Aphex Twin Hidden Live Mix)"], [3292, "Caleb Hawley – You Sexy Thing"]]}, "49_AUS_2020": {"t": "49 aus 2020", "s": "mix · 4 h 12 min · 24 December 2020", "b": "A year in which most people stayed in their rooms and the rooms became the world. Forty-nine pieces from it, put together on Christmas Eve, four hours and twelve minutes long.\n\nIt can be played from start to end, or left running in a room where nobody is, which is how much of that year was spent.", "snd": "https://archive.org/download/maxsoroca-mixes/49aus2020.mp3", "tl": [[0, "xrc – piching-pgm18"], [468, "Soundwalk Collective w/ Patti Smith – Peradam"], [901, "Siti Muharam – Sikitiko"], [1361, "Jucifer – UN OCCUPIED"], [1646, "Passepartout Duo – Heartwood (Section 3)"], [1837, "Bill Anagnos – In Progress"], [1970, "Chant Electronique – A la Mañanita y al Amanecer"], [2286, "The Bug feat. Dis Fig – You"], [2598, "Jah Schulz – Dub Mistakes"], [2813, "Çaykh – Soùmatra"], [3125, "Elektricheskaya Sobaka – Idiot Cry II"], [3698, "Café Türk – Ali Baba"], [4045, "Shit & Shine – Hillbilly Moonshine"], [4268, "NEP – Novi poredak (Metal Mix) feat. Alexx Kovacs"], [4872, "Einstürzende Neubauten – Ten Grand Goldie"], [5493, "Lilith Stangenberg – Leper"], [5602, "Fiona Apple – Fetch the Bolt Cutters"], [6300, "Bright Eyes – Mariana Trench"], [6573, "Die Aeronauten – Dieses anstrengende Leben"], [6792, "…And You Will Know Us by the Trail of Dead – Don’t Look Down"], [7170, "The Flaming Lips – Mother Please Don’t Be Sad"], [7431, "Bob Dylan – My Own Version of You"], [7474, "SAULT – Free"], [7767, "Sun Ra Arkestra – Rocket No. 9"], [8180, "Mourning [A] BLKstar – So Young So"], [8582, "Terrace Martin feat. Denzel Curry, Kamasi Washington, G Perico & Daylyt – Pig Feet"], [8793, "clipping. – Say the Name"], [9335, "Backxwash – Into the Void"], [9592, "Tricky – Hate This Pain"], [9733, "East Man & Lyrical Strally – Ten Ton Riddim"], [10022, "Speaker Music – American Marxists Have Tended to Fall into the Trap …"], [10240, "Godspeed You! Peter Andre – Clubber"], [10540, "Pharaoh Overlord – Arms of the Butcher"], [10669, "Hjelvik – Father War"], [11016, "Oranssi Pazuzu – Kuulen ääniä maan alta"], [11410, "Hey Colossus – Dead Songs for Dead Sires"], [11804, "Ayahuasca Tasting Room – Stick in Mouth"], [11914, "Billie Eilish – Therefore I Am"], [12362, "Borusiade – Lament (Fortunate Isolation)"], [12826, "Annie – American Cars"], [12893, "Pet Shop Boys – Burning the Heather"], [13201, "Squarepusher – Midi Sans Frontières Avec Batterie"], [13435, "Ferge x Fisherman – In My Shoes"], [13938, "The Avalanches – We Go On"], [14164, "Moodymann – Do Wrong"], [14219, "BMB – Real Good Time Together"], [14453, "Arurmukha – trans-zen-dental"], [14898, "Ak’chamel – The Funeral of a Woman Whose Soul Is Trapped"], [15085, "Síria – Canção de Gato"]]}, "THE_OBSERVER_EFFECT": {"t": "the observer effect", "s": "essay film and installation · work in progress", "b": "It is told that a boy in a sanatorium village in Lower Silesia watched films through a gap in the roof of the cinema. He never saw the whole screen, only the part that the gap allowed, and he made the rest up. Later he made films himself.\n\nIn a story by Borges, a man lies on his back in a cellar, looks at the nineteenth step of a staircase and sees a point that contains all other points. He cannot tell what he saw, cannot keep it, and in the end he doubts that he saw it at all, and forgets.\n\nOn 12 August 2026, on a hill in Upper Lusatia, a choir sang while the moon moved in front of the sun. The material of that day is the material of this film: a procession, a quarry, red light on stone, a figure in a hood. It is cut, coloured and changed, and the people who cut it are the observers, and part of what is reconstructed.\n\nA mind could blink up out of noise for a moment, with memories of a life it never lived, and fall apart again. A physicist calls that a Boltzmann brain. The film calls it the moon.", "vid": "vid/toe_teaser.mp4", "poster": "vid/toe_poster.jpg", "aperture": true}, "UPSET&RHYTHM": {"t": "upset&rhythm", "s": "mix", "mc": "/maxsoroca/upset-rhytmn/", "b": "Upset is what a rhythm does to a body that was standing still. Rhythm is what an upset turns into when it repeats.\n\nThis one exists only in one place, on a server in London, and it plays from there."}, "AZDAJA": {"t": "azdaja", "s": "walks · work in progress", "azdaja": true, "b": "Aždaja is the dragon of the South Slavic stories, a word that came west from the Persian aždahā. It has many heads, lives in lakes and caves, and demands what dragons demand.\n\nOne of them is said to live in Lake Skadar, the largest lake of the Balkans, half in Montenegro and half in Albania. The lake is shallow, a few metres for most of its width, but at the bottom there are springs, called eyes, that go down far below the level of the sea.\n\nAbove Shkodër stands the castle of Rozafa. Its walls fell down every night until the builders were told to wall up a woman alive. Rozafa agreed, on the condition that one breast, one hand, one eye and one foot stay free, so that she could feed her son, stroke him, watch him and rock his cradle. Water still runs down the stones of the gate, and people say it is her milk.\n\nSomeone walked along the shore, through Shirokë and around Shkodër, and did not see the dragon. That is how one knows it is there."}, "DJINNOLOGY": {"t": "djinnology", "s": "research · Mauritania · work in progress", "djinn": true, "b": "The djinn, the Qur'an says, were made from a smokeless flame of fire, before the humans, who were made from clay. They have free will, they eat and marry and die, and most of the time they cannot be seen. They prefer the places in between: ruins, wells, crossroads, the desert at noon.\n\nIn the north of Mauritania, near Ouadane, there is a structure in the Sahara some forty kilometres across, rings of rock inside rings of rock. It cannot be seen as a whole from the ground. Astronauts used it as a landmark and called it the Eye of the Sahara. For a long time people took it for the crater of a meteorite. It is a dome that the wind has worn down, layer after layer, until only its pattern remained.\n\nIn the same country, a marabout writes a verse on a wooden tablet with ink made of soot and gum, then washes the tablet, and someone drinks the water. The word goes into the body. What it does there cannot be seen either.\n\nIn the winter of 2025 a traveller went through that country with a notebook and a recorder. What he brought back is still being sorted. Perhaps the djinn are not an explanation for what cannot be explained, but a name for the moment in which noise takes on a shape and looks back."}};
