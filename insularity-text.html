var D={"fix": [[34.0, "card", "INSULARITY", true], [102.84, "card", "NON-TIME", false], [109.92, "line", "I merely see infinities everywhere, which enclose me like an atom and like a shadow that only lasts for an unrepeatable moment.", false], [492.28, "line", "You learn about a place only with time, and experience it through it.", false], [497.8, "line", "That every where and when finds its origin in a point is as vivid as a black sun – a mythical doctrine.", false], [794.04, "card", "KAMBRIAN EXPLOSION", false], [800.76, "line", "The soul is an underwater being, it is fluid and constantly changing, it needs places where it can work.", false], [1231.0, "card", "LONGUE DURÉE", true], [1676.0, "card", "ANTHROPOZÄN", true], [2325.0, "card", "MILKOMEDA", true], [2668.0, "card", "ETERNALISMUS", true], [3175.56, "end", "Dedicated to Hartmut. … thank you for that cosmic iron.", false], [3264.96, "end", "The text is based on fragments from Stephen Galfard, The Universe in Your Hand · Raoul Schrott, Erste Erde. Epos · Joseph Scheppach, The Secret Consciousness of Plants · Boris Groys, Anton Vidokle, Cosmism · Katerina Kopaka, Questioning Islands. Voice: Jessica.", false]], "bus": [2008.92, ["Melikra", "Thyrsakos", "Aigontha", "Oneira", "Nyktheon", "Pelagaia"]], "slots": [[137.76, ["In the vast expanse of the cosmos, where space and time converge in a dance of unfathomable mystery, lies the genesis of all that we know. Beyond the veil of the last scattering, where quantum potentialities intertwine, lies a realm of boundless possibilities. Here, within the infinite layers of existence, we encounter the enigma of the Big Bang, the cosmic event that ignited the flames of creation and set the universe into motion. Shrouded in a cloak of primordial chaos. 13.8 billion years ago, in the infancy of cosmic time, matter existed in a state of unimaginable density, where the very fabric of reality had yet to take form. Time itself was but a fleeting concept, and the laws that govern our universe had yet to be written.", "The origin of the cosmos is situated beyond the confines of space and time, concealed by a barrier known as the surface of the last scattering. This barrier encompasses and overlays all potential quantum states. Beyond this barrier, an infinite number of other surfaces exist. One of these surfaces is referred to as the Big Bang, which initiated the universe's expansion. Another surface veils the phenomenon that the Big Bang gave rise to. This lies outside the bounds of our conventional reality. During this event, all matter was compressed into an incredibly minuscule space of nearly boundless density. A singularity, or Aleph. At that juncture, the conventional understanding of time as we currently comprehend it had yet to take shape.", "The cosmos' origin lies beyond space and time, concealed by the surface of the last scattering. This barrier overlays all potential quantum states. Beyond it, an infinite number of other surfaces exist. One is the Big Bang, initiating the universe's expansion, while another veils the phenomenon arising from it, lying beyond conventional reality's bounds. All matter was compressed into an incredibly dense space. Our understanding of time hadn't formed then.", "The cosmos, a realm shrouded in mystery and wonder, holds within it the genesis of all existence, concealed beyond the confines of space and time, veiled by the enigmatic surface of the last scattering. This barrier, a tapestry of potential quantum states, obscures from our sight the infinite layers of reality that lie beyond.", "In the boundless depths of the cosmos, where the veils of the unknown defy imagination and the terrors of forgotten eons reverberate through the void, lies the origin of all our fears. Beyond the veil of the last scattering, where quantum uncertainties converge, lurks a realm of unspeakable horror, where the boundaries of reality blur and madness reigns supreme."], false], [288.32, ["One second post-Big Bang, neutrinos merge to form the cosmic background while the first black holes emerge. Two minutes later, atomic nucleosynthesis conditions are met, leading to the fusion of protons and neutrons into heavier elements. Initially, deuterium forms, transitioning to helium over twenty minutes. During this period the cosmos is too hot for neutral atom formation and photon propagation, enveloped in an opaque plasma.", "In the first picoseconds of cosmic time, the laws of today's physics do not yet apply. Just one second after the Big Bang, the neutrinos break away and merge with each other, forming the cosmic background. At the same time, the first black holes are starting to emerge. Two minutes later, the conditions for the synthesis of atomic nuclei are fulfilled. About a quarter of the protons and all the neutrons fuse to form more substantial elements. An all-pervasive, opaque plasma envelops all.", "As the seconds unfolded in the wake of the Big Bang, the cosmos underwent a symphony of transformation. Neutrinos merged, black holes birthed, and the alchemy of atomic nuclei synthesis began its celestial dance. Deuterium gave way to helium, and the universe, shrouded in a searing plasma, danced to the rhythm of cosmic evolution.", "As the ages passed, the universe unfolded in a symphony of cosmic terror. Neutrinos merged in a grotesque ballet of annihilation, while black holes consumed the essence of reality itself."], false], [337.32, ["About 47,000 years after the Big Bang, the universe cools, allowing matter to dominate its behavior. Another 53,000 years later, the first molecule appears – the helium hydride ion. After 370,000 years, the universe cools sufficiently for neutral atoms to form, marking its first permeability to light. However, hydrogen clouds collapse slowly, limiting their ability to become a significant light source. New atoms, mainly hydrogen and helium with traces of lithium, quickly assume their lowest energy state and emit photons, forming the cosmic background radiation still detectable today.", "About 47,000 years after the Big Bang, the universe cools, so that matter, not radiation, determines the behavior of the cosmos. 370,000 years after the beginning of time, the universe finally cools down enough for neutral atoms to form. This makes the universe permeable to light for the first time. These photons persist and can still be detected today as cosmic background radiation.", "Eons passed, and the universe cooled, yielding to the emergence of matter as the dominant force. The helium hydride ion made its celestial debut, followed by the birth of neutral atoms and the dawn of cosmic light.", "Eons drifted by like phantoms in the night, as the universe cooled and the shadows deepened. The helium hydride ion emerged from the stygian depths, heralding the dawn of a new age of cosmic terror."], false], [604.92, ["In the crucible of time, Earth emerged, a celestial jewel adrift in the cosmic ocean. The collision with a Mars-sized object birthed the moon, shaping the tides of our world.", "About 4 billion years ago, a Mars-sized body from the vastness of space hits the hitherto lifeless Earth with great force. The piece peeled off during the impact becomes our satellite, which gives the oceans their tidal range. Membranes of lipids form in the primordial ocean Tethys. They develop into protein clumps and then into cells that have a kind of skin. This makes them closed and confined, and thus the first living things on the planet.", "Around 4 billion years ago, a Mars-sized object collided with Earth, forming the Moon and influencing ocean tides. Lipid membranes formed in the primordial ocean of Tethys, evolving into protein clusters and eventually into cells.", "In the crucible of time, Earth emerged as a charnel house of cosmic horrors, a haunted relic adrift in the void. The collision with a celestial abomination birthed the Moon, casting its eldritch light upon a world gripped by fear and despair."], false], [680.0, ["Two billion years ago, an ozone belt begins to form around the atmosphere. It shields the Earth from the sun's UV radiation. Mitochondria, the power plants of our cells, can be traced back to proteobacteria, and chloroplasts, which transform light into life in plants, are undigested blue-green algae. Electrons are quantum waves in an invisible sea. They only consist of themselves. Everything flows and vibrates. Strings, branes, and fields. Every drop of water was once part of Tethys, just as every squall is part of the Scirocco.", "Two billion years ago, an ozone layer formed, shielding Earth from UV radiation and enabling the evolution of complex life. Strings, branes, and fields define reality. Every drop of water was once part of the ancient ocean Tethys.", "Through the ages, life flourished and evolved, guided by the hand of cosmic forces. Every drop of water, every gust of wind, echoes the ancient whispers of the cosmos, a testament to the interconnectedness of all things."], true], [815.36, ["The world-spanning primordial ocean Tethys surrounds the global supercontinent Pangea in the late Paleozoic and early Mesozoic. Pangea is the last of the primordial continents that enclosed all of Earth's landmasses in the Permian and persisted into the Jurassic, 150 million years ago, when the great mass extinction of species occurred, and the evolution of the dinosaurs began.", "Francis Crick says that the molecule of life is of extraterrestrial origin. Many animistic populations see this similarly, only there it is often a snake which came from the cosmos. The Cambrian Explosion is, so to speak, the zoological Big Bang. In the rock layers, fossils of first sponges, corals, annelids, crabs, and first vertebrates are found. Until today, it is unclear why so many different body forms developed at the same time and why so many of them disappeared.", "The Cambrian Explosion witnessed a rapid diversification of life forms, including sponges, corals, annelids, crabs, and vertebrates, likely driven by the development of complex features such as skeletal armor and sensory organs.", "From the primordial ocean of Tethys arose the first stirrings of life, a grotesque menagerie of writhing horrors that crawled from the depths."], false], [1380.0, ["50 or even 100,000 years ago, people settled the far-flung island world of Oceania. One trick was to sail against the wind in order to be able to use the tailwind when nothing could be found. In ancient times, people spoke of thalassocracy, the rule of the sea. The Minoans were very good seafarers and traded with Egypt, Mesopotamia, and as far as the Hindu Kush, where lapis lazuli is found. Alternatively, the history of the islands began many hundreds of millions of years ago, before Pangea was formed, in the depths of Panthalassa and Tethys.", "50,000 to 100,000 years ago, humans settled the distant islands of Oceania, employing techniques like sailing against the wind to harness favorable tailwinds.", "As humanity emerged from the shadows of prehistory, we embarked on a journey of exploration and discovery, harnessing the winds of the cosmos to chart our course. The islands of Oceania bore witness to our ingenuity.", "The islands of Oceania bore witness to our folly, as we unleashed the horrors of the cosmos upon ourselves."], true], [1770.0, ["In the noosphere, life is transformed by a new sphere of reason and communication – an optimistic variant of the Anthropocene. To be human is to be dependent on cosmic events that are uncontrollable and unknown. This is the origin of modern fear, the fear of being part of the cosmos. The will of an individual is the will of the universe.", "Human existence is intertwined with unpredictable cosmic events, giving rise to a modern fear of being part of the cosmos. All human brain processes stem from the wider universe, making individual will an extension of cosmic will.", "In the tapestry of existence, the human mind stands as a beacon of consciousness, a fragile vessel adrift in the cosmic sea. We are but ephemeral beings, caught in the ebb and flow of time.", "Yet, amidst the vastness of the cosmos, one question lingers – what is our place within it? Are we but fleeting shadows in the cosmic dance?"], true], [2160.0, ["The tragedy of being is that the human mind is aware of its material origin. Without thought, there can be no matter. At death, the atoms of a human being pass into an inorganic state. On average, it takes 100 million years for the atom to find a new embodiment. Time, like the atom, passes like nothing.", "The human mind's awareness of its material origin is a tragic aspect of existence. Without thought, matter cannot exist. At death, human atoms transition to an inorganic state, taking about 100 million years to find new forms.", "As we gaze into the abyss, we are confronted with the unsettling truth of our own material origin, a tragic aspect of our existence that binds us to the wider cosmos.", "We are but playthings of the malevolent forces that lurk in the darkness."], true], [2583.6, ["Time is not an arrow, but a landscape. It connects us to people over generations. Not linear, but rhizomatic and topological, in which the future can also be the past. There are other universes everywhere, from other dimensions. The ends of the dimensions can move freely within the dimensions, but cannot leave them. Behind the observable reality, there are infinite multiverses, bubble universes that are like drops of oil on a surface of water. They form drops within these drops. What is time? Is time real and does it exist? Past, present and future are one, equally given and real. And so together they describe a dimension in which all places and all future events are one and already inherent. This is eternalism.", "Other universes exist in different dimensions. Behind observable reality lie infinite multiverses, bubble universes resembling drops of oil on water's surface. What is time? Is it real? Past, present, and future are equally real, describing a dimension where all places and events are inherent – eternalism.", "And yet, amidst the chaos and uncertainty, there exists a glimmer of hope. For beyond the veil of observable reality lies a realm of infinite possibility, where the past, present, and future converge in a timeless dance of eternalism.", "For beyond the bounds of observable reality lie infinite multiverses, each a reflection of our own hopes and fears."], false]], "stills": [[68.48, 5], [85.60000000000001, 6], [273.92, 17], [291.04, 18], [342.40000000000003, 21], [359.52000000000004, 22], [376.64000000000004, 23], [428.0, 26], [445.12, 27], [462.24, 28], [479.36, 29], [496.48, 30], [530.72, 32], [547.84, 33], [564.96, 34], [582.08, 35], [599.2, 36], [616.32, 37], [650.5600000000001, 39], [667.6800000000001, 40], [684.8000000000001, 41], [701.9200000000001, 42], [719.0400000000001, 43], [736.1600000000001, 44], [753.2800000000001, 45], [770.4000000000001, 46], [787.5200000000001, 47], [804.6400000000001, 48], [838.88, 50], [890.24, 53], [941.6, 56], [958.72, 57], [975.84, 58], [992.96, 59], [1010.08, 60], [1027.2, 61], [1044.3200000000002, 62], [1061.44, 63], [1078.5600000000002, 64], [1095.68, 65], [1112.8, 66], [1129.92, 67], [1147.04, 68], [1164.16, 69], [1181.28, 70], [1198.4, 71], [1215.52, 72], [1301.1200000000001, 77], [1318.24, 78], [1335.3600000000001, 79], [1352.48, 80], [1369.6000000000001, 81], [1386.72, 82], [1403.8400000000001, 83], [1420.96, 84], [1438.0800000000002, 85], [1455.2, 86], [1472.3200000000002, 87], [1489.44, 88], [1506.5600000000002, 89], [1523.68, 90], [1540.8000000000002, 91], [1557.92, 92], [1575.0400000000002, 93], [1592.16, 94], [1609.2800000000002, 95], [1626.4, 96], [1643.52, 97], [1660.64, 98], [1694.88, 100], [1763.3600000000001, 104], [1780.48, 105], [1797.6000000000001, 106], [1814.72, 107], [1831.8400000000001, 108], [1848.96, 109], [1866.0800000000002, 110], [1883.2, 111], [1900.3200000000002, 112], [1917.44, 113], [1934.56000
